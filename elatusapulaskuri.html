<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elatusapulaskuri v0.569</title><style>:root{font-family:Arial,sans-serif;font-size:14px;line-height:1.25;--bg:#000c17;--panel:#001827;--head:#002b44;--line:#17677c;--text:#00d9ef;--muted:#7cb8c7;--accent:#168aff;--field:#081722;--border:#00cde5;--input:#fff}
body[data-theme=light]{--bg:#f3f7fb;--panel:#fff;--head:#e4f1fa;--line:#d9e9f6;--text:#075a85;--muted:#536f80;--accent:#168aff;--field:#fff;--border:#70a7c4;--input:#142c40}
body[data-theme=forest]{--bg:#08120f;--panel:#10271f;--head:#163a2d;--line:#275b48;--text:#9de6c0;--muted:#a1cdbb;--accent:#4ab48d;--field:#091a15;--border:#3baf87;--input:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}header{background:var(--head);border-bottom:1px solid var(--border);padding:13px 16px;display:flex;align-items:center;gap:12px}header strong{font-size:20px}header small{margin-left:auto;color:var(--muted)}main{max-width:900px;margin:auto;padding:8px}section.panel{background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:12px;margin:8px 0}h2{font-size:18px;margin:0 0 12px;display:flex;align-items:center;gap:10px}.number{display:grid;place-items:center;background:var(--accent);color:white;border-radius:50%;width:34px;height:34px;flex-shrink:0}h3{font-size:14px;margin:14px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}p{color:var(--muted)}button{background:#0055e9;color:white;border:1px solid #2791ff;border-radius:5px;padding:8px 12px;cursor:pointer;font:inherit;min-height:37px}button.secondary{background:var(--head);color:var(--text);border-color:var(--border)}button.danger{background:#702b38;border-color:#b86b79}.section-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.card{border:1px solid var(--line);border-radius:6px;margin:10px 0;overflow:hidden}.card>summary{background:var(--head);font-weight:bold;cursor:pointer;padding:11px 12px;overflow-wrap:anywhere}.card-body{padding:10px}.field-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(80px,150px) 40px;gap:8px;align-items:center;min-height:42px;padding:5px 3px;border-bottom:1px solid var(--line)}.field-label{min-width:0;overflow-wrap:anywhere;line-height:1.35}.field-control{width:100%;min-width:0;max-width:100%;height:35px;border:1px solid var(--border);border-radius:4px;background:var(--field);color:var(--input);font:inherit;padding:4px 7px;text-align:right}.field-control[type=text]{text-align:left}.unit{color:var(--muted);font-size:11px;overflow-wrap:anywhere}.info{display:inline-grid;place-items:center;border:1px solid var(--border);border-radius:50%;height:23px;width:23px;font-size:12px;margin-left:5px;cursor:help;color:var(--muted)}.group{font-weight:bold;color:var(--text);margin:16px 0 6px;border-bottom:1px solid var(--border);padding-bottom:6px}.subgroup{border:1px solid var(--line);border-radius:5px;padding:7px;margin:9px 0}.subgroup>summary{cursor:pointer;font-weight:bold;padding:5px}.muted{color:var(--muted);font-size:12px}.empty{padding:15px;border:1px dashed var(--line);border-radius:6px}.note{font-size:12px;color:var(--muted)}.theme-picker{background:var(--field);color:var(--input);border:1px solid var(--border);border-radius:4px;padding:7px;max-width:135px}.hidden{display:none!important}@media(max-width:420px){header strong{font-size:16px}.field-row{grid-template-columns:minmax(0,1fr) minmax(76px,110px) 28px;gap:5px}.field-label{font-size:12px}.unit{font-size:10px}section.panel{padding:9px}h2{font-size:16px}}@media print{body{background:white;color:black}button,.section-actions,.theme-picker{display:none!important}.panel,.card{break-inside:avoid}}
/* v0.569: kaikille korteille yhteiset kenttämitat ja mobiilirivitys */
:root{--control-height:35px;--row-min-height:42px;--field-gap:8px}
.card-body{padding:12px}.field-row{min-height:var(--row-min-height);column-gap:var(--field-gap);padding:6px 4px}.field-control{height:var(--control-height);font-size:14px}.field-label{font-size:14px;line-height:1.35;overflow-wrap:break-word}.group{margin-top:18px;margin-bottom:8px}.card>summary{line-height:1.4}.field-control:focus-visible,button:focus-visible,.theme-picker:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:420px){.card-body{padding:8px}.field-row{column-gap:5px;padding:6px 2px}.field-label{font-size:12px;line-height:1.35}.field-control{font-size:12px;padding:4px}.group{margin-top:14px}}
</style></head><body data-theme="dark"><header><strong>Elatusapulaskuri</strong><select id="theme" class="theme-picker" aria-label="Väriteema"><option value="dark">Tumma</option><option value="light">Vaalea</option><option value="forest">Metsä</option></select><small>v0.569</small></header><main><section class="panel"><h2><span class="number">1</span>Vanhemmat</h2><div id="parents"></div><div class="section-actions"><button id="add-parent" type="button">+ Lisää vanhempi</button></div></section><section class="panel"><h2><span class="number">2</span>Lapset</h2><div id="children"></div><div class="section-actions"><button id="add-child" type="button">+ Lisää lapsi</button></div></section><section class="panel"><h2><span class="number">3</span>Elatusavun laskelma</h2><div class="empty">Laskenta lisätään myöhemmin. Tässä versiossa on vain käyttöliittymä ja syöttökentät.</div></section></main><script>
'use strict';
const APP_VERSION='0.569';
const FIELD_GROUPS={"income":[["earnings","Ansiotulot"],["business","Elinkeinotoiminnan tulot"],["unemployment","Työttömyyspäiväraha"],["pension","Eläkkeet"],["social","Sosiaalietuudet"],["single","Lapsilisän yksinhuoltajakorotus"],["capital","Pääomatulot"],["assets","Muu varallisuudesta saatava tulo"],["otherIncome","Muut tulot"]],"expense":[["living","Yleiset elinkustannukset"],["housing","Asumiskustannukset"],["extraHousing","Muut asumiskustannukset"],["housingAid","Asumistuki"],["otherCost","Muut elinkustannukset"],["health","Erityiset terveydenhoitomenot"],["work","Työmatkakustannukset"],["studentLoan","Opintolainamenot"],["travel","Matkakulut lapsen tapaamisesta"]],"child":[["basic","Yleiset elinkustannukset"],["housing","Lapsen osuus asumiskustannuksista"],["daycare","Päivähoitokulut"],["afterSchool","Koululaisen aamu- ja iltapäivätoiminta"],["education","Koulutuskustannukset"],["hobby","Erityisen harrastuksen kustannukset"],["insurance","Vakuutusmaksut"],["health","Erityiset terveydenhoitokustannukset"],["otherSpecial","Muut erityiset kustannukset"]],"deduction":[["benefit","Lapsilisä"],["single","Yksinhuoltajakorotus"],["study","Lapsen opintotuki / ansiotulot"],["capital","Lapsen pääomatulot"]]};
const state={parents:[],children:[]};let sequence=0;
const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function make(kind){return {id:kind+'-'+(++sequence),name:kind==='parent'?'Vanhempi '+(state.parents.length+1):'Lapsi '+(state.children.length+1),values:{}}}
function field(key,label,value='',unit='€/kk',options=null,help=''){const id='f-'+(++sequence);const control=options?'<select class="field-control" data-key="'+escapeHtml(key)+'">'+options.map(([v,t])=>'<option value="'+escapeHtml(v)+'" '+(String(value)===String(v)?'selected':'')+'>'+escapeHtml(t)+'</option>').join('')+'</select>':'<input class="field-control" data-key="'+escapeHtml(key)+'" type="'+(unit==='text'?'text':'number')+'" '+(unit==='text'?'maxlength="100"':'min="0" step="any" inputmode="decimal"')+' value="'+escapeHtml(value)+'">';return '<label class="field-row" for="'+id+'"><span class="field-label">'+escapeHtml(label)+(help?'<span class="info" title="'+escapeHtml(help)+'" aria-label="Lisätieto">i</span>':'')+'</span>'+control.replace('class="field-control"','id="'+id+'" class="field-control"')+'<span class="unit">'+(unit==='text'?'':escapeHtml(unit))+'</span></label>'}
function fields(group,item){return FIELD_GROUPS[group].map(([k,label])=>field(group+'.'+k,label,item.values[group+'.'+k]??'')).join('')}
function heading(t){return '<div class="group">'+escapeHtml(t)+'</div>'}
function parentCard(p){return '<details class="card" data-id="'+p.id+'" open><summary>'+escapeHtml(p.name)+'</summary><div class="card-body">'+field('name','Vanhemman nimi',p.name,'text')+heading('Perustiedot')+field('livingSituation','Vanhemman perhetilanne',p.values.livingSituation??'single','',[['single','Yksin asuva'],['partner','Parisuhteessa asuva']])+heading('Tulot')+fields('income',p)+heading('Menot')+fields('expense',p)+'<div class="section-actions"><button class="danger" data-remove="parent" type="button">Poista vanhempi</button></div></div></details>'}
function childCard(c){return '<details class="card" data-id="'+c.id+'" open><summary>'+escapeHtml(c.name)+'</summary><div class="card-body">'+heading('Lapsen perustiedot')+field('name','Lapsen nimi',c.name,'text')+field('age','Lapsen ikä',c.values.age??'','vuotta')+field('method','Laskentatapa',c.values.method??'capacity','',[['capacity','Elatuskyvyn suhteessa'],['percentage','Prosenttiosuudella'],['agreement','Vanhempien sopimus']])+heading('Vanhemmat ja asuminen')+field('parentA','Vanhempi 1',c.values.parentA??'','', [['','Valitse vanhempi'],...state.parents.map(p=>[p.id,p.name])])+field('parentB','Vanhempi 2',c.values.parentB??'','', [['','Valitse vanhempi'],...state.parents.map(p=>[p.id,p.name])])+field('resident','Lapsen asuinvanhempi',c.values.resident??'','',[['','Valitse vanhempi'],...state.parents.map(p=>[p.id,p.name])])+field('nights','Kuinka monta yötä lapsi on keskimäärin tapaavan vanhemman luona kuukaudessa?',c.values.nights??'','yötä')+heading('Lapsen elatuksen tarve')+fields('child',c)+heading('Elinkustannusten vähennykset')+fields('deduction',c)+heading('Lapsilisän maksaminen')+field('benefitRecipient','Kenelle lapsilisä maksetaan?',c.values.benefitRecipient??'','',[['','Valitse vanhempi'],...state.parents.map(p=>[p.id,p.name])])+heading('Lapsen elatuksen tarve yhteensä')+'<p class="note">Yhteenveto muodostetaan, kun laskenta lisätään.</p><div class="section-actions"><button class="danger" data-remove="child" type="button">Poista lapsi</button></div></div></details>'}
function render(kind){const node=document.getElementById(kind==='parent'?'parents':'children');const items=kind==='parent'?state.parents:state.children;const opened=new Set([...node.querySelectorAll('.card[open]')].map(x=>x.dataset.id));node.innerHTML=items.map(item=>kind==='parent'?parentCard(item):childCard(item)).join('');node.querySelectorAll('.card').forEach(card=>card.open=opened.size===0||opened.has(card.dataset.id))}
function add(kind){const list=kind==='parent'?state.parents:state.children;list.push(make(kind));render(kind);if(kind==='parent')render('child')}
function update(e,kind){const control=e.target.closest('[data-key]');if(!control)return;const card=control.closest('[data-id]');if(!card)return;const list=kind==='parent'?state.parents:state.children;const item=list.find(x=>x.id===card.dataset.id);if(!item)return;const key=control.dataset.key;if(key==='name'){item.name=control.value;card.querySelector(':scope>summary').textContent=item.name;if(kind==='parent'&&e.type==='change')render('child')}else item.values[key]=control.value}
document.getElementById('parents').addEventListener('input',e=>update(e,'parent'));document.getElementById('parents').addEventListener('change',e=>update(e,'parent'));document.getElementById('children').addEventListener('input',e=>update(e,'child'));document.getElementById('children').addEventListener('change',e=>update(e,'child'));
document.querySelectorAll('#parents,#children').forEach(node=>node.addEventListener('click',e=>{const button=e.target.closest('[data-remove]');if(!button)return;const kind=button.dataset.remove,id=button.closest('[data-id]').dataset.id,list=kind==='parent'?state.parents:state.children;list.splice(list.findIndex(x=>x.id===id),1);render(kind);if(kind==='parent')render('child')}));
document.getElementById('add-parent').addEventListener('click',()=>add('parent'));document.getElementById('add-child').addEventListener('click',()=>add('child'));document.getElementById('theme').addEventListener('change',e=>document.body.dataset.theme=e.target.value);
add('parent');add('parent');add('child');
</script></body></html>
