const fieldInfoDescriptions={"pressure": "Suunnittelupaine p (bar)\n\nPutkiston mitoituksessa käytettävä suurin suunnittelupaine, ei välttämättä normaali käyttöpaine. Esimerkiksi 10 bar tarkoittaa 1,0 MPa.\n\nLaskuri vertaa tätä arvoa laskennalliseen Pmax-arvoon erikseen ilman vahvikelevyä ja vahvikelevyllä. Jos Pmax on vähintään suunnittelupaine, kyseinen paine-ehto täyttyy vertailumallissa.\n\nHuomioi mahdolliset paineiskut, staattinen nestepatsas ja muut suunnittelutilanteet erikseen.", "temp": "Suunnittelulämpötila (°C)\n\nValitse materiaalin lujuuden kannalta määräävä suunnittelulämpötila, ei vain tavallista huonelämpötilaa. Materiaalin sallittu jännitys voi pienentyä lämpötilan kasvaessa.\n\nTarkista myös mahdolliset matalan lämpötilan sitkeysvaatimukset ja lämpöliikkeet. Laskurin painevertailu ei yksin tarkasta lämpöjännityksiä.", "sameMaterials": "Materiaalien yhtenäisyys\n\nKyllä tarkoittaa, että runko-, haara- ja levymateriaalit käsitellään samana materiaalina. Ei-valinnalla tarkista jokaisen osan oma materiaali ja sallittu jännitys.\n\nSama materiaalinumero ei yksin takaa samaa toimitustilaa, lujuutta tai hitsattavuutta. Tarkista ainestodistukset.", "pskCombined": "PSK-putkiluokka\n\nPutkiluokka on suunnittelun ja hankinnan määrittely, joka voi ohjata putkikokoja, seinämiä, materiaaleja ja paineluokkaa.\n\nLaskurin esitäyttämät tiedot on verrattava hankkeen todelliseen putkiluokkaerittelyyn. Putkiluokan nimi ei itsessään osoita haaraliitoksen paineenkestoa.", "material": "Runkoputken materiaali\n\nValitse todellinen materiaalinumero, esimerkiksi 1.4307. Materiaali vaikuttaa lujuusarvoihin, lämpötilariippuvuuteen ja hitsattavuuteen.\n\nVarmista materiaalin tuotestandardi, toimitustila ja ainestodistus. Älä oleta eri materiaalilajien lujuusarvoja samoiksi.", "yield": "1,0 %:n venymisraja Rp1,0 (MPa)\n\nKuvaa jännitystä, jolla materiaalille syntyy määritelty pysyvä venymä. Austenittisilla ruostumattomilla teräksillä käytetään usein Rp1,0-arvoa sovellettavan mitoitussäännön mukaisesti.\n\nArvon tulee vastata suunnittelulämpötilaa ja materiaalin toimitustilaa. 1 MPa = 1 N/mm².", "factor": "Osavarmuusluku / jakaja\n\nLaskuri muodostaa perusmenetelmässä sallitun jännityksen jakamalla materiaalin lujuusarvon tällä luvulla. Esimerkiksi 215 / 1,5 = 143,33 MPa.\n\nÄlä muuta arvoa vain paremman paineenkestotuloksen saamiseksi. Käytettävä jakaja riippuu sovellettavista mitoitussäännöistä.", "allow": "Runkoputken sallittu jännitys f (MPa)\n\nLaskennassa käytettävä jännitystaso. Suurempi f kasvattaa laskennallista paineenkestoa, joten arvon oikeellisuus on tärkeä.\n\nEsimerkki: Rp1,0 = 215 MPa ja jakaja 1,5 → f = 143,33 MPa. Tarkista lämpötilakohtainen lujuusarvo ja soveltuvat ehdot.", "plateMaterial": "Vahvikelevyn materiaali\n\nVahvikelevy voi olla samaa tai eri materiaalia kuin runko. Tarkista materiaalin lujuus, hitsattavuus ja mahdollinen galvaaninen korroosioriski.\n\nMateriaalin vaihtaminen voi muuttaa laskennassa hyväksyttävää levyn vahvistusvaikutusta.", "plateAllow": "Materiaalien alin sallittu jännitys (MPa)\n\nKentässä näytetään runkoputken, haaraputken ja vahvikelevyn sallituista jännityksistä pienin arvo valitussa lämpötilassa.\n\nKun kaikki materiaalit ovat samoja, arvo vastaa yhteistä sallittua jännitystä. Eri materiaaleilla alin arvo päivittyy materiaalivalintojen mukaan. Kenttä on laskettu, ei käsin muokattava.", "mainDN": "Runkoputken DN-koko\n\nDN on nimelliskokomerkintä, ei putken tarkka sisä- tai ulkohalkaisija. Esimerkiksi DN200-putken ulkohalkaisija voi olla 219,1 mm.\n\nTarkista ulkohalkaisija ja seinämäpaksuus erillisistä kentistä.", "mainD": "Runkoputken ulkohalkaisija D0 (mm)\n\nPutken ulkopinnasta mitattu halkaisija. Esimerkiksi DN200: 219,1 mm.\n\nSisähalkaisija saadaan likimäärin D0 − 2 × seinämäpaksuus. Toleranssit ja korroosiovara voivat muuttaa laskentamittoja.", "mainT": "Runkoputken nimellisseinämä es (mm)\n\nPutken tilaus- tai nimellispaksuus, ei välttämättä taattu vähimmäispaksuus.\n\nLaskentapaksuutta pienentävät tarvittaessa valmistuksen negatiivinen toleranssi ja korroosiovara. Esimerkiksi 2,0 mm nimellispaksuus ja 0,25 mm vähennys → 1,75 mm.", "mainPSKT": "Putkiluokan rungon seinämäpaksuus\n\nValitun PSK-putkiluokan esitäyttämä tai ilmoittama seinämäpaksuus. Vertaa tätä putken todelliseen tilausmittaan.\n\nJos hankkeen putki poikkeaa putkiluokan oletuksesta, käytä todellista dokumentoitua seinämää.", "mainDTol": "Runkoputken halkaisijatoleranssi ΔD (mm)\n\nSallittu valmistuksesta johtuva halkaisijan poikkeama nimellismitasta.\n\nLaskurin automaattinen arvo riippuu valitusta toleranssiluokasta. Tarkista oikea toleranssi putken tuotestandardista ja ainestodistuksesta.", "mainTTol": "Runkoputken seinämätoleranssi Δes (mm)\n\nNegatiivinen valmistustoleranssi, joka vähentää käytettävissä olevaa laskentapaksuutta.\n\nEsimerkiksi 12,5 % paksuudesta 2,0 mm = 0,25 mm. Tarkista, käytetäänkö prosentti- vai vähimmäismillimetrirajaa.", "branchDN": "Haaraputken DN-koko\n\nHaaraputken nimelliskoko. Esimerkiksi DN100 tarkoittaa nimelliskokoa, mutta sen tavallinen ulkohalkaisija on 114,3 mm.\n\nVarmista, että DN-valinta vastaa haaran todellista ulkohalkaisijaa.", "branchD": "Haaraputken ulkohalkaisija d0 (mm)\n\nHaaraputken ulkomitta, jota käytetään liitoksen aukon ja geometrian arviointiin.\n\nPienikin halkaisijamuutos voi vaikuttaa painekuormitettuun pinta-alaan ja vahvistustarpeeseen.", "branchT": "Haaraputken nimellisseinämä eb (mm)\n\nHaaran seinämän nimellispaksuus. Laskennassa huomioidaan tarvittaessa valmistustoleranssi ja korroosiovara.\n\nPaksumpi haara voi kasvattaa käytettävissä olevaa vahvistusalaa, mutta vaikutus riippuu liitostyypistä ja geometriasta.", "branchPSKT": "Putkiluokan haaran seinämäpaksuus\n\nPSK-putkiluokasta saatava vertailuarvo haaraputkelle. Tarkista todellinen toimitettu seinämäpaksuus.", "branchMaterial": "Haaraputken materiaali\n\nValitse haaran todellinen materiaalilaji. Sen sallittu jännitys voi poiketa rungon arvosta.\n\nTarkista myös hitsattavuus rungon materiaaliin.", "branchAllow": "Haaraputken sallittu jännitys fb (MPa)\n\nHaaramateriaalin sallittu laskentajännitys suunnittelulämpötilassa.\n\nVaikuttaa haaran vahvistusalan laskennalliseen hyötyyn.", "branchLength": "Haaran käytettävissä oleva suora pituus (mm)\n\nMittaa haaraliitoksesta seuraavaan mutkaan, laippaan, supistukseen tai muuhun epäjatkuvuuskohtaan käytettävissä oleva suora osuus.\n\nLiian lyhyt suora osa voi rajoittaa haaran laskennallista vahvistusaluetta.", "penetrationDepth": "Läpimenevän haaran sisäänulottuma hin (mm)\n\nMittaa, kuinka monta millimetriä haaraputki jatkuu rungon sisäpinnan sisäpuolelle.\n\nKenttä liittyy erityisesti c) Läpimenevä -liitokseen. Arvo 0 tarkoittaa, ettei haara ulotu sisäpinnan ohi. Tarkista mitta poikkileikkauspiirustuksesta.", "openingD": "Aukon mitattu halkaisija (mm)\n\nSyötä rungon aukon todellinen mitta, jos se on mitattu CAD-mallista tai piirustuksesta.\n\nTyhjänä a) pintaan hitsatussa oletus on haaran ulkohalkaisija miinus nimellisseinämäpaksuus; b) istutetussa ja c) läpimenevässä oletus on haaraputken ulkohalkaisija. Täytetty arvo ohittaa automaattisen aukkoarvion. Varmista, että mitta kuvaa oikeaa poikkileikkausta ja valittua liitostyyppiä. Tyhjä kenttä käyttää automaattista arvoa.", "branchDTol": "Haaraputken halkaisijatoleranssi Δd (mm)\n\nHaaraputken ulkohalkaisijan sallittu valmistuspoikkeama. Tarkista putken tuotestandardista.", "branchTTol": "Haaraputken seinämätoleranssi Δeb (mm)\n\nHaaran seinämän negatiivinen toleranssi vähennetään tarvittaessa laskentapaksuudesta.\n\nOhutseinäisillä putkilla vähennys voi vaikuttaa tulokseen huomattavasti.", "plateW": "Vahvikelevyn leveys lpl (mm)\n\nMäärittää levyn ulottuman liitoksen ympärillä laskurin geometriamallissa. Tarkista piirustuksesta, mitataanko leveys aukon reunasta vai muusta lähtöpisteestä.\n\nLeveyden kasvattaminen ei aina kasvata hyväksyttävää vahvistusalaa rajatta. Huomioi levyn muoto ja hitsaus.", "plateT": "Vahvikelevyn paksuus epl (mm)\n\nLevyn nimellispaksuus. Oletusarvona käytetään rungon seinämäpaksuutta, mutta voit muuttaa arvon käsin.\n\nTarkista levyn todellinen paksuus, valmistustoleranssi ja mahdollinen korroosiovara. Paksumpi levy ei korvaa puutteellista hitsausta.", "cadMode": "Pinta-alojen laskentatapa\n\nAutomaattinen: laskuri arvioi Ap-, Afs- ja Afb-pinta-alat syötettyjen mittojen ja liitostyypin perusteella.\n\nCAD: käytetään itse mitattuja pinta-aloja. Mittaa alat samoilla rajauksilla ja yksikössä mm². Älä sekoita eri liitostyyppien mittoja keskenään.", "cadAp": "CAD-mitattu painekuormitettu pinta-ala Ap (mm²)\n\nPaineen kuormittaman alueen pinta-ala haaraliitoksen poikkileikkauksessa. Syötä CAD:stä mitattu arvo, jos CAD-tila on käytössä.\n\nSuurempi Ap kasvattaa tarvittavaa vahvistusta.", "cadAfs": "CAD-mitattu rungon vahvistusala Afs (mm²)\n\nRunkoputken vahvistukseen osallistuva pinta-ala. Mittaa vain soveltuvan geometrian mukainen osuus, ei koko putken seinämää.\n\nSyötä yksikössä mm².", "cadAfb": "CAD-mitattu haaran vahvistusala Afb (mm²)\n\nHaaraputken seinämän vahvistukseen osallistuva pinta-ala. Huomioi liitostapa ja käytettävissä oleva suora pituus.\n\nSyötä yksikössä mm².", "jointCoefficient": "Putken pitkittäissauman liitoskerroin z\n\nKuvaa putken pitkittäissauman vaikutusta soveltuvassa mitoituksessa. Esimerkiksi z = 1,0 ei tarkoita, että haaraliitoksen hitsi olisi automaattisesti hyväksytty.\n\nÄlä sekoita tätä hitsin laatutasoon tai tarkastuslaajuuteen.", "weld": "Hitsin säde rx (mm)\n\nLaskurin geometriamallissa käytettävä hitsiin liittyvä mitta. Varmista, että arvo vastaa todellista hitsin muotoa.\n\nHitsin lisäaineen vaikutusta ei tule olettaa vahvistukseksi ilman soveltuvaa laskentaperustetta.", "corrosion": "Korroosiovara c0 (mm)\n\nSuunniteltu seinämän kulumis- tai korroosiovähennys käyttöiän aikana.\n\nEsimerkiksi 0,5 mm korroosiovara pienentää 2,0 mm seinämän käytettävissä olevaa paksuutta merkittävästi. Valitse arvo prosessin, materiaalin ja suunnitteluperusteiden mukaan.", "padShape": "Levyn muodon ja symmetrian tarkistus\n\nVarmista, että levy ulottuu riittävästi haaran ympärille, vastaa putken kaarevuutta eikä jätä haitallisia rakoja.\n\nTarkista myös levyjen jatkokset, aukon reunat ja soveltuva valmistuspiirustus. Merkintä on käyttäjän kuittaus, ei automaattinen tarkastus.", "padWeld": "Vahvikelevyn hitsauksen ja kiinnityksen tarkistus\n\nVarmista hitsien sijainti, jatkuvuus, mitat ja toteutettavuus. Tarkista tarvittaessa tuuletus-/koereikä ja hitsauksen työjärjestys.\n\nPelkkä vahvikelevyn pinta-ala ei osoita liitoksen toteutuskelpoisuutta.", "weldPenetration": "Istutushitsin tunkeuma\n\nTäysläpäisevä: hitsi läpäisee suunnitellun liitospaksuuden. Osittainen: läpäisy on rajallinen.\n\nValinta on kuvattava hitsausohjeessa ja liitosdetaljissa. Hitsin todellinen tunkeuma on varmistettava asianmukaisin menetelmin.", "serviceClass": "Käyttöolosuhteet\n\nNormaali tarkoittaa laskurin yleistä oletustilannetta. Väsyttävä kuormitus voi aiheutua toistuvasta paineesta, lämpötilasta tai värähtelystä. Viruminen liittyy korkeisiin lämpötiloihin ja pitkäaikaiseen kuormitukseen.\n\nNämä tilanteet voivat edellyttää erillisiä laskelmia. Pelkkä valinta ei tee väsymis- tai virumisanalyysiä.", "qualityVerified": "Hitsin laatutason todennus\n\nMerkitse vasta, kun sovellettava hitsin laatutaso on tarkastettu asiakirjoista ja toteutuksesta.\n\nLaatutaso B/C/D kuvaa virheiden hyväksymisrajoja, ei hitsin lujuuskerrointa.", "ndtVT": "VT – silmämääräinen tarkastus\n\nTarkastetaan esimerkiksi hitsin muoto, pinnan virheet, reunahaavat ja näkyvät halkeamat.\n\nVT ei paljasta kaikkia hitsin sisäisiä virheitä. Tarkastuksen suorittajan pätevyys ja dokumentointi on huomioitava.", "ndtPT": "PT – tunkeumanestetarkastus\n\nMenetelmä paljastaa pintaan avautuvia epäjatkuvuuksia. Soveltuu myös austeniittisille ruostumattomille teräksille.\n\nPinta on puhdistettava, ja menetelmä ei osoita syvällä olevia sisäisiä virheitä.", "ndtMT": "MT – magneettijauhetarkastus\n\nMenetelmä havaitsee pinnan ja pinnanläheisiä epäjatkuvuuksia ferromagneettisissa materiaaleissa.\n\nTavallisille austeniittisille ruostumattomille teräksille, kuten 1.4307, MT ei yleensä sovellu. PT voi olla vaihtoehto.", "ndtRT": "RT – radiografinen tarkastus\n\nRöntgen- tai gammasäteilyyn perustuva hitsin tilavuustarkastus. Soveltuvuus riippuu liitosgeometriasta, paksuudesta ja virhetyypistä.\n\nSäteilyturvallisuus, menetelmäohje ja tarkastuspätevyys ovat välttämättömiä.", "ndtUT": "UT – ultraäänitarkastus\n\nUltraääni etsii hitsin sisäisiä epäjatkuvuuksia. Soveltuvuus riippuu materiaalista, seinämäpaksuudesta, liitoksen muodosta ja käytetystä tekniikasta.\n\nOhutseinäisille tai hankalageometrisille haaraliitoksille menetelmä voi olla rajoittunut.", "ndtScope": "Tarkastuslaajuuden ja hyväksynnän toteaminen\n\nVarmista, mitä liitoksia tarkastetaan, millä menetelmällä ja kuinka laajasti. Kirjaa myös hyväksymisrajat, tarkastajan pätevyys ja pöytäkirjojen tunnukset.\n\nTämä kuittaus ei itsessään korvaa tarkastusasiakirjoja."};

 const infoText = id==='weldQuality' ? weldQualityInfo : id==='toleranceClass' ? toleranceInfo : (fieldInfoDescriptions[id] || label.replace(/<[^>]+>/g,'')+': laskennassa käytettävä tieto.');

 return `<div class="field"><div>${label}</div><div class="symbol">${symbol}</div>${control}<div class="unit">${unit}</div><button class="info" title="${escapedInfo}" aria-label="${label.replace(/<[^>]+>/g,'')} – lisätiedot">i</button>${otherPSK}</div>`;

 ['Halkaisijasuhde ja soveltamisehto','d<sub>i</sub>/D<sub>i</sub>','diameterRatio','–','HALKAISIJASUHTEEN SOVELTUVUUS (EN 13480-3:2024):\n\nSALLITTU (VAHVIKELEVYN SUHDE-EHTO): dᵢ/Dᵢ ≤ 0,8. Vahvikelevyn käyttö edellyttää lisäksi kohdan 8.3.6 paine- ja lämpötilarajojen sekä muiden vaatimusten täyttymistä.\n\nEI SALLITTU (VAHVIKELEVY): dᵢ/Dᵢ > 0,8. Tämä ei tarkoita, että vahvistamaton liitos olisi automaattisesti kielletty.\n\nSUURI AUKKO (8.4.4): kun 0,8 < dᵢ/Dᵢ ≤ 1,0, kohdan 8.4.3 laskentaa voidaan käyttää kohdan 8.4.4 rajoituksin. Suuren aukon vahvistaminen materiaalin virumisalueella ei ole sallittua. Tämä rajoitus ei koske kohdassa mainittuja taottuja T-kappaleita.\n\nERILLINEN TARKASTELU: dᵢ/Dᵢ > 1,0 jää tämän suhdealueen ulkopuolelle.\n\nNäytön SALLITTU / EI SALLITTU koskee vain vahvikelevyn halkaisijasuhteen ehtoa, ei koko haaraliitoksen hyväksyntää.']]],
 ['Aukon ja käytettävissä olevan pituuden geometria',[[ 'Rungon laskennallinen sisähalkaisija','D<sub>i</sub>','DiCalc','mm','D_i = D₀ − 2e_as.'],['Haaran laskennallinen sisähalkaisija','d<sub>i</sub>','diCalc','mm','d_i = d₀ − 2e_ab.'],['Runkoputken aukon halkaisija','d<sub>aukko</sub>','openingCalc','mm','a) Pintaan hitsattu: d_aukko = d₀ − t_b. b) Istutettu ja c) Läpimenevä: d_aukko = d₀ eli haaraputken ulkohalkaisija. Käyttäjän syöttämä mitattu aukko ohittaa oletuksen.'],['Haaran käytettävissä oleva suora pituus','L<sub>b,tod</sub>','branchAvailable','mm','Todellinen yhtenäinen suora haaraputken pituus liitoksen reunasta seuraavaan epäjatkuvuuskohtaan. Käyttäjän mittatieto.'],['Haaran laskennassa hyväksyttävä pituus','r<sub>b,tod</sub>','rbActual','mm','r_b = min(0,5√(d_eq e_ab), L_b,tod), EN 13480-3 (8.4.3-2).']]],
 ['Vahvistuspinta-alat',[
 ['Runkoputken vahvistuspinta-ala','A<sub>fs</sub>','Afs','mm²','Kuva 8.4.3-1: A_fs = l_s × e_as, tasapaksun rungon suorakulmainen poikkileikkaus, kun vahvistusalue on käytettävissä kokonaan.'],
 ['Haaraputken vahvistuspinta-ala','A<sub>fb</sub>','Afb','mm²','Käyttäjän esimerkkilaskelman sivu 3: A_fb = (min(l_b,L_b,tod) + e_as) × e_ab. SET-ON-esimerkkimallin suorakulmainen poikkileikkaus.'],
 ['Vahvikelevyn vahvistuspinta-ala','A<sub>fpl</sub>','Apl','mm²','A_fpl = min(l_pl,l_s) × min(e_a,pl,e_as). Laskuri rajaa laskentaan hyväksyttävän levyn leveyden ja paksuuden, mutta ilmoittaa ylimitoituksen erikseen.'],
 ['Vahvistuspinta-alat yhteensä','A<sub>f</sub>','Af','mm²','A_f = A_fs + A_fb + A_fpl. Geometrisessa A_p-laskennassa käytetään A_f,0=A_fs+A_fb, jotta vahvikelevy ei muuta painekuormitettua aukkoaluetta.']]],
 ['Paineen tarkistus',[
 ['Hitsin pyöristysalue (vain lisätieto)','A<sub>r</sub>','Ar','mm²','A_r = r_x²(4 − π)/4 on geometrinen pyöristyksen pinta-ala. Tätä ei lisätä A_p:hen eikä vähennetä siitä; sitä ei myöskään lueta hitsin vahvistusalaksi ilman erillistä standardiperustetta.'],
 ['Painekuormitettu pinta-ala (CAD / automaattinen vertailu)','A<sub>p</sub>','Ap','mm²','CAD-tilassa A_p on käyttäjän mittaama pinta-ala. Automaattisessa vertailussa R_s = (D₀ − 2e_as)/2, r_b = (d₀ − 2e_ab)/2 ja L = min(l_b, L_b,tod). Pintaan hitsattu: A_p = R_s(r_b + l_s) + r_b L. Istutettu: tähän lisätään r_b e_as. Läpimenevä: tähän lisätään r_b(e_as + h_in). Nämä ovat validoimattomia vertailumalleja, eivät vahvistettuja EN 13480-3:n kaavoja. Hitsin pyöristysalaa A_r ei sisällytetä A_p:hen.'],
 ['Sallittu paineala, vahvistamaton','A<sub>p,max,0</sub>','ApMaxBare','mm²','EN 13480-3:2024, 8.4.3-3: A_p,max = [(f_s − p_c/2)A_fs + (f_b − p_c/2)A_fb] / p_c. P_c yksikössä MPa. Tämä ei ole geometrinen A_p.'],
 ['Sallittu paineala, vahvikelevyllä','A<sub>p,max,pl</sub>','ApMaxPlate','mm²','EN 13480-3:2024, 8.4.3-7: A_p,max = [(f_s − p_c/2)A_fs + (f_b − p_c/2)A_fb + (f_pl − p_c/2)A_fpl] / p_c. Ei tarkoita levyn käyttörajoitusten täyttymistä.'],

function strengthAt(material,temp){
 const data=materialStrength[material];if(!data||!Number.isFinite(temp))return null;
 if(Object.prototype.hasOwnProperty.call(data,String(temp)))return data[String(temp)];
 const ts=Object.keys(data).map(Number).sort((a,b)=>a-b);
 for(let i=1;i<ts.length;i++){
  const lo=ts[i-1],hi=ts[i];
  // Interpolointi vain vierekkäisten alkuperäisten taulukkorivien välillä.
  const allTemps=[20,100,150,200,250,300,350,400,450,500,550];
  if(temp>lo&&temp<hi&&allTemps.indexOf(hi)===allTemps.indexOf(lo)+1)
   return data[String(lo)]+(data[String(hi)]-data[String(lo)])*(temp-lo)/(hi-lo);
 }
 return null;
}

const main=document.getElementById('main');main.innerHTML=section(0,`<div class="install-choice"><div class="install-choice-heading"><h3>Liitostyyppi</h3><button type="button" class="info" id="installationInfoButton" title="Havainnekuvat ovat suuntaa antavia. Valitse liitostyyppi yllä olevilla valintatäpillä; vahvikelevyn mitat annetaan kohdassa 6.\n\nLIITOSTYYPPIEN EROT\n\na) Pintaan hitsattu (SET-ON): Haaraputki asetetaan runkoputken ulkopintaan tehdyn aukon päälle. Haaran pää muotoillaan runkoputken kaarevuuteen sopivaksi ja liitos hitsataan ulkopuolelta. Haara ei normaalisti ulotu runkoputken sisälle.\n\nb) Istutettu (SET-IN): Haaraputken pää sovitetaan runkoputkeen tehtyyn aukkoon. Haara ulottuu rungon seinämän alueelle, mutta ei tarkoituksellisesti läpäise runkoputkea kokonaan. Aukon ja sovituksen mitat vaikuttavat liitosgeometriaan.\n\nc) Läpimenevä (SET-THROUGH): Haaraputki viedään runkoputken seinämän läpi ja se voi ulottua rungon sisäpuolelle. Sisäänulottuma ja vapaa virtausaukko on tarkistettava erikseen. Sisään ulottuva haara voi vaikuttaa virtaukseen ja painehäviöön.\n\nVAHVIKELEVY: Kaikkiin liitostyyppeihin voidaan tarkastella erillistä vahvikelevyä. Levyn leveys, paksuus ja materiaali annetaan kohdassa 6. Vahvikelevy ei korvaa hitsauksen ja liitoksen muiden ehtojen tarkastamista.\n\nVALINTAOHJE: Valitse liitostyyppi todellisen valmistustavan ja piirustuksen mukaan. Liitostyypin vaihtaminen muuttaa laskurin käyttämää geometriaa. Havainnekuvat eivät ole mittakaavassa.\n\nValittu: a) Pintaan hitsattu. Voit käyttää CAD-mitattuja pinta-aloja lisäasetuksissa." aria-label="Liitostyypin lisätiedot">i</button></div><div class="install-radio-grid">${['a) Pintaan hitsattu','b) Istutettu','c) Läpimenevä'].map((name,i)=>`<label class="install-option"><input type="radio" name="installationChoice" value="${name}" ${i===0?'checked':''} onchange="setInstallationChoice(this.value)"><span>${name}</span></label>`).join('')}</div><div class="joint-reference-sections"><div function getIstutusValues(){const obj={};inputs().forEach(x=>obj[x.dataset.key]=x.type==='checkbox'?x.checked:x.value);return obj;}
function istutusFilename(obj){
 const clean=v=>String(v??'').trim().replace(/[^0-9.,]/g,'').replace(/,/g,'.')||'ei_tietoa';
 return `Istutus_Runko_${clean(obj.mainD)}x${clean(obj.mainT)}_Haara_${clean(obj.branchD)}x${clean(obj.branchT)}.json`;
}
function save(){
 const obj=getIstutusValues();
 try{localStorage.setItem('istutuslaskuri-esikatselu',JSON.stringify(obj));}catch(e){}
 const currentVersion=(document.querySelector('.app-menu-version')?.textContent||'').match(/0\.\d+/)?.[0]||'0.178';
 const data={format:'Istutuslaskuri',version:currentVersion,savedAt:new Date().toISOString(),values:obj};
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});
 const url=URL.createObjectURL(blob),link=document.createElement('a');
 link.href=url;link.download=istutusFilename(obj);document.body.appendChild(link);link.click();link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function applyIstutusValues(obj){
 if(!obj||typeof obj!=='object'||Array.isArray(obj))throw Error('Virheellinen tallennustiedosto.');
 plateThicknessManuallyEdited=(obj.plateT!==undefined);
 inputs().forEach(x=>{if(Object.prototype.hasOwnProperty.call(obj,x.dataset.key)){
 if(x.type==='checkbox')x.checked=(obj[x.dataset.key]===true||obj[x.dataset.key]==='Kyllä');
 else x.value=String(obj[x.dataset.key]);
 }});
 updatePSK();updateStrength();updateTolerances();updatePressureChecks();
}
function load(){
 let picker=document.getElementById('istutusFilePicker');
 if(!picker){picker=document.createElement('input');picker.type='file';picker.accept='.json,application/json';picker.id='istutusFilePicker';picker.hidden=true;document.body.appendChild(picker);
 picker.addEventListener('change',async()=>{const file=picker.files?.[0];if(!file)return;
 try{const data=JSON.parse(await file.text());if(data.format&&data.format!=='Istutuslaskuri')throw Error('Tiedosto ei ole Istutuslaskurin tallenne.');
 applyIstutusValues(data.values||data);try{localStorage.setItem('istutuslaskuri-esikatselu',JSON.stringify(getIstutusValues()));}catch(e){}
 alert('Istutus ladattu: '+file.name);
 }catch(e){alert('Tallenteen avaaminen epäonnistui: '+e.message);}finally{picker.value='';}
 });}
 picker.click();
}
function loadLastSaved(){try{const data=localStorage.getItem('istutuslaskuri-esikatselu');if(!data)throw Error('Selaimeen tallennettua istutusta ei löydy.');applyIstutusValues(JSON.parse(data));alert('Viimeisin istutus ladattu.');}catch(e){alert(e.message);}}

try{setResultStyle(localStorage.getItem('istutuslaskuri-result-style')||'classic')}catch(e){setResultStyle('classic')}

 const ex=reportExactTranslations[activeLanguage],idx=reportExactKeys.indexOf(core);

 if(ratio)return reportRatioTemplates[activeLanguage].replace('{ratio}',ratio[1]).replace('{check}',translateValue(ratio[2]));
 const keys=reportTermKeys,values=reportTermTranslations[activeLanguage];
 const pairs=keys.map((key,i)=>[key,values[i]]).sort((a,b)=>b[0].length-a[0].length);

}

pplicable tolerance class and product standard.","Negative header wall-thickness tolerance reduces the calculation thickness; 12.5% of 2.0 mm equals 0.25 mm.","DN is the branch nominal size, not its measured outside diameter. DN100 commonly corresponds to 114.3 mm OD.","The actual branch outside diameter affects opening geometry, pressure-loaded area and reinforcement requirements.","Nominal branch wall thickness. Apply negative tolerance and corrosion allowance; reinforcement depends on geometry.","Piping-class reference wall thickness for the branch. Confirm against the supplied pipe.","Select the actual branch material and verify its temperature-dependent allowable stress.","Allowable calculation stress of the branch material at design temperature. It cannot be credited above the permitted header limit.","Measure the straight branch length available from the joint to the next bend, flange or other discontinuity.","For a through-branch, enter how far it extends past the inner surface of the header. This affects the geometry model.","Enter the measured header opening diameter if available. It overrides the automatic opening model; verify the joint type.","Manufacturing tolerance of the branch outside diameter. Verify the relevant product standard.","Negative branch wall tolerance is deducted from effective thickness. Verify the documented tolerance.","The pad width determines its extent around the branch. Only the portion allowed by the calculation model can be credited.","Nominal reinforcement pad thickness. The credited thickness is limited by the applicable geometry rules.","Automatic mode estimates Ap, Afs and Afb from dimensions. CAD mode uses measured section areas; verify consistency.","CAD-measured pressure-loaded area Ap in mm². Use the same section and geometry conventions as the other areas.","CAD-measured header reinforcement area Afs in mm². Include only material permitted by the calculation model.","CAD-measured branch reinforcement area Afb in mm². Include only material permitted by the calculation model.","Factor z concerns the pipe longitudinal seam, not the strength of the branch attachment weld.","Weld radius used in the comparison geometry. Weld reinforcement is not automatically credited without a justified rule.","Corrosion or wear allowance subtracted from available wall thickness over the service life.","Confirm pad shape, symmetry and extent around the opening, including clearance and manufacturability.","Confirm pad attachment weld position, continuity, dimensions and inspection requirements.","Full penetration joins the intended thickness; partial penetration does not. Verify the specified weld design and quality.","Select normal, fatigue or creep service conditions. These may require additional checks beyond static pressure.","Confirm the weld quality level against inspection evidence and the project requirements.","VT visual inspection checks weld shape, surface defects and dimensions; confirm the required extent.","PT liquid penetrant testing detects surface-breaking flaws, including in many non-magnetic materials.","MT magnetic particle testing detects surface and near-surface flaws in ferromagnetic materials.","RT radiography examines internal weld discontinuities using X-rays or gamma rays.","UT ultrasonic testing detects internal discontinuities; suitability depends on weld geometry and material.","Confirm NDT methods, extent and acceptance under EN 13480-5 and the project inspection plan."],"sv":["Högsta dimensioneringstryck, inte nödvändigtvis drifttrycket. Jämför med Pmax för båda alternativen; kontrollera tryckstötar och statisk höjd separat.","Välj dimensionerande temperatur. Materialhållfastheten kan minska vid högre temperatur; termiska spänningar kontrolleras separat.","Ja använder samma material för stamrör, gren och förstärkningsplåt. Vid Nej ska material och tillåtna spänningar kontrolleras separat.","Rörklassen anger dimensioner, material och tryckklass. Kontrollera förinställningarna mot projektets rörklass.","Välj verklig materialkvalitet och kontrollera produktstandard, leveranstillstånd, hållfasthet och svetsbarhet.","Rp1,0 är 1 % sträckgräns. Använd värdet vid dimensioneringstemperaturen; 1 MPa = 1 N/mm².","Materialhållfastheten divideras med denna faktor för tillåten spänning. Ändra inte faktorn för att förbättra resultatet.","Tillåten spänning f påverkar beräknad tryckhållfasthet. Kontrollera temperaturberoende materialvärden.","Kontrollera plåtmaterialets hållfasthet, svetsbarhet och korrosionskompatibilitet.","Det lägsta värdet för tillåten spänning hos stamrör, gren och plåt beräknas automatiskt.","DN är nominell storlek, inte exakt diameter. DN200 har ofta ytterdiametern 219,1 mm.","Ange stamrörets verkliga ytterdiameter D0. Innerdiametern är ungefär D0 minus två väggtjocklekar.","Nominell väggtjocklek är inte garanterad minimitjocklek. Beakta minustolerans och korrosionsmån.","Jämför rörklassens väggtjocklek med det dokumenterade stamröret.","Tillverkningstolerans för stamrörets ytterdiameter. Kontrollera produktstandarden.","Negativ väggtjocklekstolerans minskar beräkningstjockleken; 12,5 % av 2,0 mm är 0,25 mm.","DN anger grenens nominella storlek. DN100 har ofta ytterdiametern 114,3 mm.","Grenens ytterdiameter påverkar öppningens geometri och behovet av förstärkning.","Nominell grenväggtjocklek. Beakta minustolerans, korrosionsmån och geometri.","Rörklassens referenstjocklek för grenen; kontrollera levererad tjocklek.","Välj grenens faktiska material och kontrollera tillåten spänning vid temperaturen.","Tillåten beräkningsspänning i grenen vid dimensioneringstemperatur.","Mät rak tillgänglig grenlängd fram till nästa böj, fläns eller avbrott.","Ange hur långt en genomgående gren sträcker sig innanför stamrörets inneryta.","Ange uppmätt håldiameter om tillgänglig. Den ersätter den automatiska geometrin.","Tillverkningstolerans för grenens ytterdiameter; kontrollera produktstandarden.","Negativ väggtjocklekstolerans dras från grenens effektiva tjocklek.","Plåtbredden bestämmer utsträckningen runt grenen; bara tillåten del får tillgodoräknas.","Plåtens nominella tjocklek; tillgodoräknad tjocklek begränsas av geometriregler.","Automatik uppskattar Ap, Afs och Afb. CAD använder uppmätta tvärsnittsareor.","CAD-uppmätt tryckbelastad area Ap i mm²; använd konsekvent geometri.","CAD-uppmätt förstärkningsarea i stamröret Afs i mm².","CAD-uppmätt förstärkningsarea i grenen Afb i mm².","Faktorn z gäller rörets längssvets, inte grenanslutningens svets.","Svetsradien används i geometrimodellen; svetsförstärkning räknas inte automatiskt.","Korrosions- eller slitmån som minskar tillgänglig väggtjocklek.","Kontrollera plåtens form, symmetri och utsträckning runt öppningen.","Kontrollera plåtens svetsläge, kontinuitet, mått och inspektion.","Full genomsvetsning omfattar avsedd tjocklek; partiell gör det inte.","Välj normal drift, utmattning eller krypning; ytterligare kontroller kan krävas.","Bekräfta svetskvalitetsnivån mot kontrollresultat och projektkrav.","VT visuell kontroll granskar form, ytfel och dimensioner.","PT penetrantprovning påvisar ytöppna defekter.","MT magnetpulverprovning påvisar ytliga och ytnära fel i ferromagnetiska material.","RT radiografi granskar inre svetsfel med röntgen- eller gammastrålning.","UT ultraljudsprovning påvisar inre fel; lämplighet beror på material och geometri.","Bekräfta kontrollmetoder, omfattning och acceptans enligt EN 13480-5."],"de":["Höchster Auslegungsdruck, nicht zwingend Betriebsdruck. Mit Pmax für beide Varianten vergleichen; Druckstöße und statische Höhe gesondert prüfen.","Maßgebende Auslegungstemperatur wählen. Die Werkstofffestigkeit kann bei Wärme sinken; Wärmespannungen separat prüfen.","Ja verwendet denselben Werkstoff für Hauptrohr, Abzweig und Verstärkungsblech. Bei Nein jeden Werkstoff gesondert prüfen.","Rohrklasse legt Maße, Werkstoffe und Druckstufe fest. Vorgaben mit der Projektspezifikation vergleichen.","Tatsächliche Werkstoffnummer wählen; Produktnorm, Lieferzustand, Festigkeit und Schweißbarkeit prüfen.","Rp1,0 ist die 1-%-Dehngrenze. Wert bei Auslegungstemperatur verwenden; 1 MPa = 1 N/mm².","Die Festigkeit wird durch diesen Faktor geteilt. Den Faktor nicht zur Ergebnisverbesserung verringern.","Zulässige Spannung f bestimmt die rechnerische Druckfestigkeit. Temperaturabhängige Werte prüfen.","Werkstoff, Schweißbarkeit und Korrosionsverträglichkeit des Verstärkungsblechs prüfen.","Der kleinste zulässige Spannungswert von Hauptrohr, Abzweig und Blech wird berechnet.","DN ist eine Nennweite, kein genauer Durchmesser. DN200 hat häufig 219,1 mm Außendurchmesser.","Tatsächlichen Außendurchmesser D0 des Hauptrohrs eingeben. Innendurchmesser ungefähr D0 minus zweimal Wanddicke.","Nennwanddicke ist keine garantierte Mindestdicke. Minustoleranz und Korrosionszuschlag berücksichtigen.","Wanddicke der Rohrklasse mit dem tatsächlich spezifizierten Hauptrohr vergleichen.","Fertigungstoleranz des Hauptrohr-Außendurchmessers; Produktnorm prüfen.","Negative Wanddickentoleranz mindert die Rechendicke; 12,5 % von 2,0 mm sind 0,25 mm.","DN ist die Nennweite des Abzweigs. DN100 hat häufig 114,3 mm Außendurchmesser.","Der Abzweig-Außendurchmesser beeinflusst Öffnung und Verstärkungsbedarf.","Nennwanddicke des Abzweigs; Minustoleranz und Korrosionszuschlag berücksichtigen.","Referenzwanddicke des Abzweigs aus der Rohrklasse; Liefermaße prüfen.","Tatsächlichen Abzweigwerkstoff und zulässige Spannung bei Temperatur prüfen.","Zulässige Berechnungsspannung des Abzweigwerkstoffs bei Auslegungstemperatur.","Verfügbare gerade Abzweiglänge bis zum nächsten Bogen oder Flansch messen.","Überstand des durchgehenden Abzweigs über die Innenfläche des Hauptrohrs angeben.","Gemessenen Öffnungsdurchmesser eingeben; überschreibt die automatische Geometrie.","Fertigungstoleranz des Abzweig-Außendurchmessers; Produktnorm prüfen.","Negative Wanddickentoleranz vom wirksamen Abzweigquerschnitt abziehen.","Blechbreite bestimmt die Ausdehnung um den Abzweig; nur zulässiger Anteil wird angerechnet.","Nennblechdicke; anrechenbare Dicke ist geometrisch begrenzt.","Automatik schätzt Ap, Afs und Afb; CAD nutzt gemessene Querschnittsflächen.","CAD-gemessene druckbelastete Fläche Ap in mm²; Geometrie einheitlich halten.","CAD-gemessene Verstärkungsfläche des Hauptrohrs Afs in mm².","CAD-gemessene Verstärkungsfläche des Abzweigs Afb in mm².","Faktor z betrifft die Längsnaht des Rohrs, nicht die Abzweigschweißnaht.","Schweißradius im Geometriemodell; Schweißverstärkung wird nicht automatisch angerechnet.","Korrosions- oder Verschleißzuschlag mindert die verfügbare Wanddicke.","Form, Symmetrie und Ausdehnung des Blechs um die Öffnung prüfen.","Lage, Durchgängigkeit, Abmessungen und Prüfung der Blechschweißnähte prüfen.","Vollständige Durchschweißung erfasst die vorgesehene Dicke; teilweise nicht.","Normalbetrieb, Ermüdung oder Kriechen wählen; zusätzliche Nachweise können nötig sein.","Schweißnahtgüte anhand von Prüfnachweisen und Projektanforderungen bestätigen.","VT Sichtprüfung prüft Form, Oberflächenfehler und Maße.","PT Eindringprüfung erkennt zur Oberfläche offene Fehler.","MT Magnetpulverprüfung erkennt oberflächennahe Fehler in ferromagnetischem Material.","RT Durchstrahlungsprüfung untersucht innere Fehler mittels Röntgen- oder Gammastrahlung.","UT Ultraschallprüfung erkennt innere Fehler; Eignung hängt von Material und Geometrie ab.","Prüfverfahren, Prüfumfang und Annahme nach EN 13480-5 bestätigen."],"fr":["Pression maximale de calcul, pas forcément de service. Comparer à Pmax avec et sans renfort; vérifier séparément les coups de bélier.","Choisir la température de calcul déterminante. La résistance peut diminuer avec la chaleur; vérifier les contraintes thermiques.","Oui applique le même matériau au tube principal, à la branche et à la plaque. Sinon vérifier chaque matériau.","La classe de tuyauterie définit dimensions, matériaux et pression. Vérifier les valeurs avec le dossier du projet.","Choisir la nuance réelle et vérifier norme produit, état de livraison, résistance et soudabilité.","Rp1,0 est la limite conventionnelle à 1 % d'allongement. Utiliser la valeur à la température de calcul.","La résistance est divisée par ce coefficient. Ne pas le réduire pour améliorer artificiellement le résultat.","La contrainte admissible f influe sur la tenue en pression. Vérifier les valeurs selon la température.","Vérifier matériau, soudabilité et compatibilité anticorrosion de la plaque.","La plus faible contrainte admissible des trois composants est calculée automatiquement.","DN est un diamètre nominal, pas une mesure exacte. DN200 correspond souvent à 219,1 mm extérieur.","Saisir le diamètre extérieur réel D0 du tube principal; diamètre intérieur ≈ D0 moins deux épaisseurs.","L'épaisseur nominale n'est pas l'épaisseur minimale garantie. Déduire tolérance négative et corrosion.","Comparer l'épaisseur de la classe de tuyauterie à celle réellement spécifiée.","Tolérance de fabrication du diamètre extérieur principal; vérifier la norme produit.","La tolérance négative réduit l'épaisseur de calcul; 12,5 % de 2,0 mm = 0,25 mm.","DN indique la taille nominale de la branche. DN100 correspond souvent à 114,3 mm extérieur.","Le diamètre extérieur de la branche influence l'ouverture et le besoin de renfort.","Épaisseur nominale de la branche; tenir compte des tolérances et de la corrosion.","Épaisseur de référence de la branche selon la classe; vérifier la livraison.","Choisir le matériau réel de la branche et sa contrainte admissible à température.","Contrainte de calcul admissible du matériau de la branche à la température choisie.","Mesurer la longueur droite disponible jusqu'au prochain coude ou à la bride.","Saisir la pénétration de la branche traversante au-delà de la face intérieure du tube principal.","Saisir le diamètre mesuré de l'ouverture; il remplace la valeur automatique.","Tolérance du diamètre extérieur de la branche; vérifier la norme produit.","Déduire la tolérance négative de l'épaisseur utile de la branche.","La largeur de plaque détermine son étendue; seule la partie admissible est prise en compte.","Épaisseur nominale de plaque; l'épaisseur utile est limitée par la géométrie.","Le mode automatique estime Ap, Afs et Afb; le mode CAD utilise les aires mesurées.","Aire Ap sous pression mesurée dans la CAO en mm²; utiliser une géométrie cohérente.","Aire de renfort Afs du tube principal mesurée dans la CAO en mm².","Aire de renfort Afb de la branche mesurée dans la CAO en mm².","Le coefficient z concerne la soudure longitudinale du tube, pas la soudure de branchement.","Rayon de soudure du modèle géométrique; aucun renfort de soudure n'est ajouté automatiquement.","Surépaisseur de corrosion ou d'usure retranchée de l'épaisseur utile.","Vérifier forme, symétrie et étendue de la plaque autour de l'ouverture.","Vérifier position, continuité, dimensions et contrôles des soudures de la plaque.","Une pénétration complète traverse l'épaisseur prévue; une pénétration partielle non.","Choisir service normal, fatigue ou fluage; des vérifications supplémentaires peuvent s'imposer.","Confirmer le niveau de qualité de soudure par les contrôles et exigences du projet.","VT contrôle visuel de la forme, des défauts de surface et des dimensions.","PT ressuage détecte les défauts débouchant en surface.","MT magnétoscopie détecte les défauts proches de la surface dans les matériaux ferromagnétiques.","RT radiographie détecte les défauts internes par rayons X ou gamma.","UT ultrasons détecte les défauts internes selon matériau et géométrie.","Confirmer méthodes, étendue et acceptation des contrôles selon EN 13480-5."],"es":["Presión máxima de diseño, no necesariamente de operación. Comparar con Pmax con y sin refuerzo; revisar golpes de presión.","Elegir la temperatura de diseño crítica. La resistencia puede disminuir al calentarse; revisar tensiones térmicas aparte.","Sí aplica el mismo material a tubería principal, ramal y placa. Si No, verificar cada material por separado.","La clase de tubería define dimensiones, materiales y presión nominal. Comprobarla con la especificación del proyecto.","Seleccionar el material real y comprobar norma, estado de suministro, resistencia y soldabilidad.","Rp1,0 es el límite convencional al 1 %. Usar el valor a temperatura de diseño; 1 MPa = 1 N/mm².","La resistencia se divide por este factor. No reducirlo solo para mejorar el resultado.","La tensión admisible f influye en la resistencia a presión. Comprobar el valor según temperatura.","Verificar material, soldabilidad y compatibilidad frente a corrosión de la placa.","Se calcula la tensión admisible mínima entre tubería principal, ramal y placa.","DN es tamaño nominal, no diámetro exacto. DN200 suele tener 219,1 mm exteriores.","Introducir el diámetro exterior real D0; diámetro interior ≈ D0 menos dos espesores.","El espesor nominal no garantiza el mínimo. Descontar tolerancia negativa y corrosión.","Comparar el espesor de clase con la tubería principal realmente especificada.","Tolerancia de fabricación del diámetro exterior principal; revisar la norma.","La tolerancia negativa reduce el espesor de cálculo; 12,5 % de 2,0 mm = 0,25 mm.","DN indica tamaño nominal del ramal. DN100 suele tener 114,3 mm exteriores.","El diámetro exterior del ramal afecta al orificio y al refuerzo requerido.","Espesor nominal del ramal; considerar tolerancia negativa y corrosión.","Espesor de referencia del ramal según clase; verificar el tubo suministrado.","Seleccionar el material real del ramal y su tensión admisible a temperatura.","Tensión de cálculo admisible del material del ramal a temperatura de diseño.","Medir la longitud recta disponible hasta el siguiente codo o brida.","Introducir cuánto sobresale el ramal pasante dentro de la tubería principal.","Introducir diámetro medido del orificio; sustituye el cálculo automático.","Tolerancia del diámetro exterior del ramal; verificar norma de producto.","Descontar la tolerancia negativa del espesor útil del ramal.","El ancho de placa determina su extensión; solo se acredita la parte permitida.","Espesor nominal de placa; el espesor acreditado depende de la geometría.","El modo automático estima Ap, Afs y Afb; CAD usa áreas medidas.","Área Ap sometida a presión medida en CAD en mm²; mantener geometría coherente.","Área Afs de refuerzo de la tubería principal medida en CAD en mm².","Área Afb de refuerzo del ramal medida en CAD en mm².","El coeficiente z corresponde a la soldadura longitudinal, no a la del ramal.","Radio de soldadura en el modelo geométrico; no se acredita automáticamente como refuerzo.","Margen de corrosión o desgaste restado del espesor útil.","Verificar forma, simetría y extensión de la placa alrededor del orificio.","Verificar posición, continuidad, dimensiones e inspección de las soldaduras de placa.","La penetración completa atraviesa el espesor previsto; la parcial no.","Elegir servicio normal, fatiga o fluencia; pueden requerirse otras verificaciones.","Confirmar la calidad de soldadura con inspecciones y requisitos del proyecto.","VT inspección visual de forma, defectos superficiales y dimensiones.","PT líquidos penetrantes detectan discontinuidades abiertas a la superficie.","MT partículas magnéticas detectan defectos superficiales en materiales ferromagnéticos.","RT radiografía detecta defectos internos con rayos X o gamma.","UT ultrasonidos detecta defectos internos según material y geometría.","Confirmar métodos, alcance y aceptación de inspecciones según EN 13480-5."],"it":["Pressione massima di progetto, non necessariamente di esercizio. Confrontare con Pmax con e senza rinforzo; verificare i colpi di pressione.","Selezionare la temperatura di progetto determinante. La resistenza può calare al crescere della temperatura.","Sì applica lo stesso materiale a tubo principale, derivazione e piastra. Altrimenti verificare ogni materiale.","La classe tubazioni definisce dimensioni, materiali e pressione. Verificare i valori con il progetto.","Selezionare il materiale effettivo e verificarne norma, stato di fornitura, resistenza e saldabilità.","Rp1,0 è il limite convenzionale all'1 %. Usare il valore alla temperatura di progetto.","La resistenza viene divisa per questo coefficiente. Non ridurlo per migliorare il risultato.","La tensione ammissibile f determina la resistenza alla pressione; verificare il valore in temperatura.","Verificare materiale, saldabilità e compatibilità alla corrosione della piastra.","Si calcola la minima tensione ammissibile tra tubo principale, derivazione e piastra.","DN è dimensione nominale, non diametro esatto. DN200 ha spesso diametro esterno 219,1 mm.","Inserire il diametro esterno reale D0; diametro interno ≈ D0 meno due spessori.","Lo spessore nominale non è quello minimo garantito. Sottrarre tolleranza negativa e corrosione.","Confrontare lo spessore della classe con il tubo principale effettivamente previsto.","Tolleranza di fabbricazione del diametro esterno principale; verificare la norma.","La tolleranza negativa riduce lo spessore utile; 12,5 % di 2,0 mm = 0,25 mm.","DN indica la dimensione nominale della derivazione. DN100 spesso corrisponde a 114,3 mm.","Il diametro esterno della derivazione influenza apertura e rinforzo necessario.","Spessore nominale della derivazione; considerare tolleranza e corrosione.","Spessore di riferimento della derivazione da classe; verificare il tubo fornito.","Selezionare il materiale reale della derivazione e la tensione ammissibile in temperatura.","Tensione ammissibile della derivazione alla temperatura di progetto.","Misurare la lunghezza diritta disponibile fino a curva o flangia successiva.","Indicare la sporgenza della derivazione passante oltre la superficie interna del tubo.","Inserire il diametro misurato dell'apertura; prevale sul modello automatico.","Tolleranza del diametro esterno della derivazione; verificare la norma.","Sottrarre la tolleranza negativa dallo spessore utile della derivazione.","La larghezza della piastra ne determina l'estensione; si considera solo la parte ammessa.","Spessore nominale della piastra; quello utile è limitato dalla geometria.","Il modello automatico stima Ap, Afs e Afb; CAD usa le aree misurate.","Area Ap caricata dalla pressione misurata in CAD in mm²; usare geometria coerente.","Area Afs di rinforzo del tubo principale misurata in CAD in mm².","Area Afb di rinforzo della derivazione misurata in CAD in mm².","Il coefficiente z riguarda la saldatura longitudinale del tubo, non quella della derivazione.","Raggio di saldatura del modello; il metallo saldato non è conteggiato automaticamente.","Sovraspessore di corrosione o usura sottratto allo spessore utile.","Verificare forma, simmetria ed estensione della piastra attorno all'apertura.","Verificare posizione, continuità, dimensioni e controlli delle saldature della piastra.","La penetrazione completa attraversa lo spessore previsto; quella parziale no.","Scegliere esercizio normale, fatica o scorrimento viscoso; possono servire altre verifiche.","Confermare la qualità della saldatura con controlli e requisiti di progetto.","VT esame visivo di forma, difetti superficiali e dimensioni.","PT liquidi penetranti rilevano difetti affioranti in superficie.","MT particelle magnetiche rilevano difetti superficiali in materiali ferromagnetici.","RT radiografia rileva difetti interni con raggi X o gamma.","UT ultrasuoni rilevano difetti interni secondo materiale e geometria.","Confermare metodi, estensione e accettazione dei controlli secondo EN 13480-5."],"pt":["Pressão máxima de projeto, não necessariamente de operação. Comparar com Pmax com e sem reforço; verificar golpes de pressão.","Escolher a temperatura de projeto determinante. A resistência pode diminuir com a temperatura; avaliar tensões térmicas.","Sim usa o mesmo material no tubo principal, ramal e chapa. Caso contrário, verificar cada material.","A classe de tubagem define dimensões, materiais e pressão nominal. Conferir com o projeto.","Selecionar o material real e verificar norma, condição de fornecimento, resistência e soldabilidade.","Rp1,0 é a tensão convencional a 1 %. Usar o valor à temperatura de projeto.","A resistência é dividida por este fator. Não o reduzir apenas para melhorar o resultado.","A tensão admissível f afeta a resistência à pressão. Conferir o valor com a temperatura.","Verificar material, soldabilidade e compatibilidade à corrosão da chapa.","Calcula-se a menor tensão admissível entre tubo principal, ramal e chapa.","DN é dimensão nominal, não diâmetro exato. DN200 costuma ter 219,1 mm externos.","Introduzir o diâmetro externo real D0; diâmetro interno ≈ D0 menos duas espessuras.","A espessura nominal não garante a mínima. Descontar tolerância negativa e corrosão.","Comparar a espessura da classe com o tubo principal efetivamente especificado.","Tolerância de fabrico do diâmetro externo principal; conferir a norma.","A tolerância negativa reduz a espessura útil; 12,5 % de 2,0 mm = 0,25 mm.","DN indica a dimensão nominal do ramal. DN100 costuma ter 114,3 mm externos.","O diâmetro externo do ramal afeta a abertura e o reforço necessário.","Espessura nominal do ramal; considerar tolerância negativa e corrosão.","Espessura de referência do ramal pela classe; verificar o tubo fornecido.","Selecionar o material real do ramal e a tensão admissível à temperatura.","Tensão admissível do ramal à temperatura de projeto.","Medir o comprimento reto disponível até à próxima curva ou flange.","Introduzir quanto o ramal passante avança para além da face interna do tubo.","Introduzir o diâmetro medido da abertura; substitui o cálculo automático.","Tolerância do diâmetro externo do ramal; conferir a norma.","Descontar a tolerância negativa da espessura útil do ramal.","A largura da chapa define a sua extensão; só a parte permitida é considerada.","Espessura nominal da chapa; a espessura considerada depende da geometria.","O modo automático estima Ap, Afs e Afb; CAD usa áreas medidas.","Área Ap sob pressão medida em CAD em mm²; usar geometria coerente.","Área Afs de reforço do tubo principal medida em CAD em mm².","Área Afb de reforço do ramal medida em CAD em mm².","O fator z refere-se à soldadura longitudinal, não à soldadura do ramal.","Raio de soldadura no modelo; o reforço da solda não é considerado automaticamente.","Margem de corrosão ou desgaste subtraída da espessura útil.","Verificar forma, simetria e extensão da chapa em redor da abertura.","Verificar posição, continuidade, dimensões e inspeção das soldaduras da chapa.","Penetração total atravessa a espessura prevista; penetração parcial não.","Escolher serviço normal, fadiga ou fluência; podem ser necessárias outras verificações.","Confirmar o nível de qualidade da soldadura com inspeções e requisitos do projeto.","VT inspeção visual de forma, defeitos superficiais e dimensões.","PT líquidos penetrantes detetam descontinuidades abertas à superfície.","MT partículas magnéticas detetam defeitos superficiais em materiais ferromagnéticos.","RT radiografia deteta defeitos internos com raios X ou gama.","UT ultrassons detetam defeitos internos conforme material e geometria.","Confirmar métodos, extensão e aceitação das inspeções segundo EN 13480-5."],"ru":["Максимальное расчётное давление, не обязательно рабочее. Сравните с Pmax для обоих вариантов; отдельно учтите гидроудары.","Выберите определяющую расчётную температуру. Прочность может снижаться при нагреве; температурные напряжения проверяются отдельно.","«Да» означает один материал для основной трубы, ответвления и накладки. При «Нет» проверьте каждый материал.","Класс трубопровода задаёт размеры, материалы и давление. Сверьте параметры с проектной спецификацией.","Выберите фактическую марку материала; проверьте стандарт, состояние поставки, прочность и свариваемость.","Rp1,0 — условный предел текучести при деформации 1 %. Используйте значение при расчётной температуре.","Прочность делится на этот коэффициент. Не уменьшайте его ради улучшения результата.","Допускаемое напряжение f влияет на расчётную прочность. Проверьте температурную зависимость.","Проверьте материал накладки, свариваемость и коррозионную совместимость.","Автоматически определяется минимальное допускаемое напряжение основной трубы, ответвления и накладки.","DN — условный размер, не точный диаметр. Для DN200 наружный диаметр часто 219,1 мм.","Введите фактический наружный диаметр D0; внутренний ≈ D0 минус две толщины стенки.","Номинальная толщина не гарантирует минимальную. Учитывайте минусовой допуск и коррозию.","Сравните толщину по классу трубопровода с фактической спецификацией основной трубы.","Допуск наружного диаметра основной трубы; проверьте стандарт изделия.","Отрицательный допуск уменьшает расчётную толщину; 12,5 % от 2,0 мм = 0,25 мм.","DN — условный размер ответвления. Для DN100 наружный диаметр часто 114,3 мм.","Наружный диаметр ответвления влияет на отверстие и требуемое усиление.","Номинальная толщина стенки ответвления; учитывайте допуск и коррозию.","Справочная толщина ответвления по классу; проверьте поставленную трубу.","Выберите фактический материал ответвления и допускаемое напряжение при температуре.","Допускаемое расчётное напряжение материала ответвления при расчётной температуре.","Измерьте доступную прямую длину ответвления до следующего отвода или фланца.","Укажите выступ сквозного ответвления за внутреннюю поверхность основной трубы.","Введите измеренный диаметр отверстия; он заменяет автоматический расчёт.","Допуск наружного диаметра ответвления; проверьте стандарт изделия.","Отрицательный допуск вычитается из эффективной толщины ответвления.","Ширина накладки определяет её вылет; учитывается только допустимая часть.","Номинальная толщина накладки; учитываемая толщина ограничена геометрией.","Автоматический режим оценивает Ap, Afs и Afb; CAD использует измеренные площади.","Площадь Ap под давлением из CAD в мм²; используйте согласованную геометрию.","Площадь усиления основной трубы Afs из CAD в мм².","Площадь усиления ответвления Afb из CAD в мм².","Коэффициент z относится к продольному шву трубы, не к шву ответвления.","Радиус шва в геометрической модели; усиление швом автоматически не учитывается.","Припуск на коррозию или износ, вычитаемый из эффективной толщины.","Проверьте форму, симметрию и охват отверстия накладкой.","Проверьте расположение, непрерывность, размеры и контроль швов накладки.","Полный провар охватывает заданную толщину; неполный — нет.","Выберите обычную работу, усталость или ползучесть; возможны дополнительные проверки.","Подтвердите уровень качества сварки результатами контроля и требованиями проекта.","VT визуальный контроль формы, поверхностных дефектов и размеров.","PT капиллярный контроль выявляет дефекты, выходящие на поверхность.","MT магнитопорошковый контроль выявляет поверхностные дефекты ферромагнитных материалов.","RT радиография выявляет внутренние дефекты рентгеновским или гамма-излучением.","UT ультразвук выявляет внутренние дефекты с учётом материала и геометрии.","Подтвердите методы, объём и приёмку контроля по EN 13480-5."],"zh":["最大设计压力，不一定是运行压力。分别与有无补强板时的 Pmax 比较，并单独检查压力冲击。","选择控制强度的设计温度。材料强度可能随温度升高而下降；热应力需另行校核。","“是”表示主管、支管和补强板使用相同材料；否则分别核实材料和许用应力。","管道等级规定尺寸、材料和压力等级。应与项目规范核对，等级名称不能证明接头强度。","选择实际材料牌号，并核对产品标准、交货状态、强度和焊接性。","Rp1,0 为 1% 规定塑性延伸强度。采用设计温度下的数值；1 MPa = 1 N/mm²。","材料强度除以该系数得到许用应力。不可为改善结果而随意减小系数。","许用应力 f 影响计算耐压能力；应核实温度对应的材料数值。","核对补强板材料、焊接性和耐腐蚀相容性。","自动计算主管、支管和补强板许用应力中的最小值。","DN 为公称尺寸，并非精确直径。DN200 的常见外径为 219.1 mm。","输入主管实际外径 D0；内径约为 D0 减去两倍壁厚。","公称壁厚不等于保证最小壁厚；应扣除负制造公差和腐蚀裕量。","将管道等级壁厚与主管实际规格核对。","主管外径制造公差；应查验产品标准。","负壁厚公差会减小计算壁厚；2.0 mm 的 12.5% 为 0.25 mm。","DN 为支管公称尺寸。DN100 常见外径为 114.3 mm。","支管外径影响开孔几何及所需补强面积。","支管公称壁厚；应考虑负公差、腐蚀裕量及几何影响。","支管管道等级参考壁厚；应核实实际供货尺寸。","选择支管实际材料，并核对设计温度下的许用应力。","支管材料在设计温度下的许用计算应力。","测量接头至下一弯头、法兰或不连续处的可用直管长度。","输入贯穿式支管超出主管内壁的伸入长度。","输入实测开孔直径；该值将覆盖自动几何计算。","支管外径制造公差；应核对产品标准。","负壁厚公差从支管有效壁厚中扣除。","补强板宽度决定覆盖范围；仅计入模型允许的部分。","补强板公称厚度；可计入厚度受几何规则限制。","自动模式估算 Ap、Afs 和 Afb；CAD 模式使用实测截面积。","CAD 实测承压面积 Ap，单位 mm²；各面积必须采用一致几何定义。","CAD 实测主管补强面积 Afs，单位 mm²。","CAD 实测支管补强面积 Afb，单位 mm²。","系数 z 用于管道纵向焊缝，不代表支管连接焊缝强度。","几何模型中的焊缝圆角半径；焊缝补强面积不会自动计入。","从有效壁厚中扣除的腐蚀或磨损裕量。","核实补强板形状、对称性及其在开孔周围的覆盖范围。","核实补强板焊缝位置、连续性、尺寸和检验要求。","全焊透覆盖规定连接厚度；部分焊透则不能。","选择正常、疲劳或蠕变工况；可能需要额外校核。","依据检验记录和项目要求确认焊缝质量等级。","VT 目视检验检查焊缝外形、表面缺陷和尺寸。","PT 渗透检测识别表面开口缺陷。","MT 磁粉检测识别铁磁性材料的表面及近表面缺陷。","RT 射线检测通过 X 射线或伽马射线识别内部缺陷。","UT 超声检测识别内部缺陷；适用性取决于材料与几何。","依据 EN 13480-5 确认无损检测方法、范围和验收要求。"]};
const localizedInfoExtras={"en":{"safety":"Check the applicable standards, material certificates and project requirements before accepting the design.","weld":"EN ISO 5817:2023 defines weld imperfection acceptance levels. B is the strictest, C intermediate and D the least strict. The required level and NDT extent depend on the project and EN 13480. Selecting a level does not constitute acceptance.","tolerance":"Manufacturing tolerances depend on the product standard and tolerance class. Verify actual diameter and negative wall-thickness tolerances against the material certificate.","installation":"Choose the actual joint geometry: a) set-on, b) inserted, or c) through-branch. Opening dimensions and credited reinforcement areas depend on the selected type. Verify dimensions from drawings.","formula":"Calculation reference and geometric relationship. Use the displayed equation with project-specific input values. A pressure comparison is not a design approval.","pressure":"Pmax is the calculated maximum pressure for the selected geometry and reinforcement. The pressure condition is met when Pmax ≥ design pressure. Check geometry, welds and applicability separately."},"sv":{"safety":"Kontrollera tillämpliga standarder, materialintyg och projektkrav före godkännande.","weld":"EN ISO 5817:2023 anger acceptansnivåer för svetsfel: B är strängast, C mellan och D lindrigast. Nivå och provningsomfattning bestäms av projektet och EN 13480.","tolerance":"Tillverkningstoleranser beror på produktstandard och klass. Kontrollera verkliga diameter- och minustjocklekstoleranser.","installation":"Välj verklig fogtyp: a) påsvetsad, b) instucken eller c) genomgående gren. Geometri och förstärkningsareor beror på valet.","formula":"Beräkningsreferens och geometriskt samband. Kontrollera formeln mot projektets indata; tryckjämförelse är inte konstruktionsgodkännande.","pressure":"Pmax är beräknat högsta tryck. Villkoret uppfylls när Pmax ≥ dimensioneringstrycket. Kontrollera geometri, svetsar och tillämplighet separat."},"de":{"safety":"Anwendbare Normen, Werkstoffzeugnisse und Projektanforderungen vor Freigabe prüfen.","weld":"EN ISO 5817:2023 definiert Bewertungsgruppen für Schweißnahtunregelmäßigkeiten: B streng, C mittel, D weniger streng. Prüfumfang gemäß Projekt und EN 13480 festlegen.","tolerance":"Fertigungstoleranzen hängen von Produktnorm und Klasse ab. Durchmesser und negative Wanddickentoleranz prüfen.","installation":"Tatsächlichen Anschlusstyp wählen: a) aufgesetzt, b) eingesetzt oder c) durchgehend. Öffnung und Verstärkungsflächen hängen davon ab.","formula":"Berechnungsbezug und geometrische Beziehung. Formel mit Projektdaten prüfen; Druckvergleich ist keine Konstruktionsfreigabe.","pressure":"Pmax ist der berechnete maximale Druck. Das Kriterium gilt bei Pmax ≥ Auslegungsdruck als erfüllt. Geometrie und Schweißnähte separat prüfen."},"fr":{"safety":"Vérifier normes applicables, certificats matière et exigences du projet avant validation.","weld":"EN ISO 5817:2023 définit les niveaux de qualité des imperfections: B le plus strict, C intermédiaire, D le moins strict. Niveau et étendue des CND selon EN 13480.","tolerance":"Les tolérances dépendent de la norme produit et de la classe. Vérifier diamètres et tolérances négatives d'épaisseur.","installation":"Choisir le type réel: a) posé, b) inséré ou c) traversant. L'ouverture et les aires de renfort dépendent du choix.","formula":"Référence de calcul et relation géométrique. Vérifier avec les données du projet; une comparaison de pression ne vaut pas validation.","pressure":"Pmax est la pression maximale calculée. Le critère est satisfait si Pmax ≥ pression de calcul. Vérifier séparément géométrie et soudures."},"es":{"safety":"Comprobar normas aplicables, certificados de material y requisitos del proyecto antes de aprobar.","weld":"EN ISO 5817:2023 define niveles de calidad de imperfecciones: B más exigente, C intermedio y D menos exigente. Nivel y alcance de END según proyecto y EN 13480.","tolerance":"Las tolerancias dependen de la norma y clase de producto. Verificar diámetro y tolerancia negativa de espesor.","installation":"Elegir unión real: a) sobrepuesta, b) insertada o c) pasante. Abertura y áreas de refuerzo dependen del tipo.","formula":"Referencia de cálculo y relación geométrica. Verificar con datos del proyecto; la comparación de presión no equivale a aprobación.","pressure":"Pmax es la presión máxima calculada. Se cumple si Pmax ≥ presión de diseño. Revisar geometría y soldaduras por separado."},"it":{"safety":"Verificare norme applicabili, certificati dei materiali e requisiti di progetto prima dell'approvazione.","weld":"EN ISO 5817:2023 definisce livelli di qualità delle imperfezioni: B più severo, C intermedio, D meno severo. Livello e controlli secondo progetto ed EN 13480.","tolerance":"Le tolleranze dipendono dalla norma di prodotto e dalla classe. Verificare diametro e tolleranza negativa dello spessore.","installation":"Scegliere il giunto reale: a) appoggiato, b) inserito o c) passante. Apertura e aree di rinforzo dipendono dal tipo.","formula":"Riferimento di calcolo e relazione geometrica. Verificare con dati di progetto; il confronto pressorio non è approvazione.","pressure":"Pmax è la pressione massima calcolata. Il criterio è soddisfatto se Pmax ≥ pressione di progetto. Verificare geometria e saldature."},"pt":{"safety":"Verificar normas aplicáveis, certificados de material e requisitos do projeto antes de aprovar.","weld":"EN ISO 5817:2023 define níveis de qualidade de imperfeições: B mais rigoroso, C intermédio e D menos rigoroso. Nível e END segundo projeto e EN 13480.","tolerance":"As tolerâncias dependem da norma e classe do produto. Verificar diâmetro e tolerância negativa de espessura.","installation":"Escolher o tipo real: a) sobreposto, b) inserido ou c) passante. Abertura e áreas de reforço dependem do tipo.","formula":"Referência de cálculo e relação geométrica. Verificar com dados do projeto; comparação de pressão não é aprovação.","pressure":"Pmax é a pressão máxima calculada. O critério cumpre-se se Pmax ≥ pressão de projeto. Verificar geometria e soldaduras."},"ru":{"safety":"Перед утверждением проверьте применимые стандарты, сертификаты материалов и требования проекта.","weld":"EN ISO 5817:2023 задаёт уровни качества дефектов сварки: B самый строгий, C средний, D менее строгий. Уровень и объём контроля определяются проектом и EN 13480.","tolerance":"Допуски зависят от стандарта изделия и класса. Проверьте диаметр и отрицательный допуск толщины.","installation":"Выберите фактический тип: a) накладной, b) вставной или c) сквозной. Геометрия отверстия и площади усиления зависят от типа.","formula":"Расчётная ссылка и геометрическая зависимость. Проверьте формулу по проектным данным; сравнение давления не является допуском.","pressure":"Pmax — расчётное максимальное давление. Условие выполнено при Pmax ≥ расчётного давления. Геометрию и сварку проверяйте отдельно."},"zh":{"safety":"批准设计前，应核对适用标准、材料证明和项目要求。","weld":"EN ISO 5817:2023 规定焊缝缺陷质量等级：B 最严格，C 居中，D 较宽松。具体等级和无损检测范围由项目及 EN 13480 确定。","tolerance":"制造公差取决于产品标准和公差等级。应核实实际直径和负壁厚公差。","installation":"选择实际连接形式：a) 表面焊接、b) 插入式或 c) 贯穿式。开孔尺寸和可计入补强面积随类型变化。","formula":"计算依据和几何关系。应使用项目数据核对公式；压力比较不等于设计批准。","pressure":"Pmax 为计算最大压力。Pmax ≥ 设计压力时满足该比较条件。几何、焊缝和适用范围须另行核实。"}};
function localizeInfoContent(message,title){
 if(activeLanguage==='fi')return {message,title};
 const lang=activeLanguage,ex=localizedInfoExtras[lang],original=String(message||'');
 const item=Object.entries(fieldInfoDescriptions).find(([,v])=>v===original);
 if(item){
   const key=item[0],idx=infoKeys.indexOf(key);
   const entry=Object.values(configs).flat().find(row=>row&&row[4]===key);
   const fiTitle=entry?entry[0].replace(/<[^>]+>/g,''):title.replace(/ – lisätiedot$/,'');
   const heading=translateValue(fiTitle);
   return {title:heading,message:heading+'\n\n'+(localizedInfoNotes[lang]?.[idx]||ex.formula)+'\n\n'+ex.safety};
 }

function translateValue(text){
  const match=/^(\s*)([\s\S]*?)(\s*)$/.exec(text);
  if(!match)return text;
  const lead=match[1],core=match[2],tail=match[3];
  if(!core||activeLanguage==='fi')return text;
  const dict=dictionaries[activeLanguage]||{};
  let translated=dict[core];
  if(translated===undefined)translated=translateReportSupplement(core);
  if(translated===undefined){
    // Dynamic result lines retain numerical values, units and technical symbols.
    const patterns=[
      [/^(Suunnittelupaine) (.+)$/,'$1'],
      [/^(Liitostyyppi): (.+)$/,'$1'],
      [/^(Vahvikelevy) (.+)$/,'$1'],
      [/^(Runko) (.+)$/,'$1'],
      [/^(Haara) (.+)$/,'$1']
    ];
    for(const [rx] of patterns){
      const m=core.match(rx);
      if(m&&dict[m[1]]){translated=dict[m[1]]+core.slice(m[1].length);break;}
    }
  }
  {
    let partial=translated===undefined?core:translated;
    // Translate connection names within dynamic result lines and figure captions.
    for(const term of ['Kuva 1. Valittu liitostyyppi:','a) Pintaan hitsattu','b) Istutettu','c) Läpimenevä','vahvikelevyllä','ilman vahvikelevyä']){
      if(dict[term])partial=partial.split(term).join(dict[term]);
    }
    if(partial!==(translated===undefined?core:translated))translated=partial;
  }
  if(translated===undefined&&core.startsWith('Huom. lämpötila ')){
    const match=core.match(/^Huom\. lämpötila (.+?) °C: putkiluokan suurinta sallittua painetta ei ole vahvistettu\. (.+?) bar on vain nimellispaine\.$/);
    if(match){
      const [_,temperature,pressure]=match;
      const patterns={
        en:`Note: at ${temperature} °C, the maximum allowable pressure of this piping class is not verified. ${pressure} bar is only the nominal pressure.`,
        sv:`Obs: vid ${temperature} °C är rörklassens högsta tillåtna tryck inte verifierat. ${pressure} bar är endast nominellt tryck.`,
        de:`Hinweis: Bei ${temperature} °C ist der maximal zulässige Druck dieser Rohrklasse nicht bestätigt. ${pressure} bar ist nur der Nenndruck.`,
        fr:`Remarque : à ${temperature} °C, la pression maximale admissible n'est pas vérifiée. ${pressure} bar est seulement la pression nominale.`,
        es:`Nota: a ${temperature} °C no está verificada la presión máxima admisible. ${pressure} bar es solo la presión nominal.`,
        it:`Nota: a ${temperature} °C la pressione massima ammissibile non è verificata. ${pressure} bar è solo la pressione nominale.`,
        pt:`Nota: a ${temperature} °C a pressão máxima admissível não está verificada. ${pressure} bar é apenas a pressão nominal.`,
        ru:`Примечание: при ${temperature} °C максимальное допустимое давление не подтверждено. ${pressure} бар — только номинальное давление.`,
        zh:`注意：在 ${temperature} °C 时，尚未核实该管道等级的最大许用压力。${pressure} bar 仅为公称压力。`
      };
      translated=patterns[activeLanguage];
    }
  }
  return lead+(translated===undefined?core:translated)+tail;
}
function processText(node){
 if(!node||node.nodeType!==3||!node.parentElement)return;
 if(node.parentElement.closest('script,style,svg,noscript,textarea,option[data-i18n-skip]'))return;
 const current=node.nodeValue;
 let rec=originals.get(node);
 if(!rec||current!==rec.last){rec={original:current,last:current};originals.set(node,rec);}
 const translated=activeLanguage==='fi'?rec.original:translateValue(rec.original);
 if(current!==translated){rec.last=translated;node.nodeValue=translated;}
}
function processAttributes(el){
 if(!el||el.nodeType!==1)return;
 for(const name of ['placeholder','aria-label','alt','title']){
   if(!el.hasAttribute(name))continue;
   const attrKey='data-i18n-original-'+name;
   let original=el.getAttribute(attrKey);
   if(original===null){original=el.getAttribute(name);el.setAttribute(attrKey,original);}
   const translated=activeLanguage==='fi'?original:(name==='title'&&el.matches('button.info')?localizeInfoContent(original,'').message:translateValue(original));
   if(el.getAttribute(name)!==translated)el.setAttribute(name,translated);
 }
}
function translateTree(root){
 if(!root)return;
 const doc=root.ownerDocument||document;
 if(root.nodeType===1){processAttributes(root);if(root.tagName==='OPTION'&&!root.hasAttribute('value'))root.value=root.value;}
 const elements=root.querySelectorAll?root.querySelectorAll('*'):[];
 for(const el of elements){
   if(el.tagName==='OPTION'&&!el.hasAttribute('value'))el.value=el.value;
   processAttributes(el);
 }
 const walker=doc.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 let node;while((node=walker.nextNode()))processText(node);
}
