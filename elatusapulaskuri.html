<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elatusapulaskuri v0.594</title><style>:root{font-family:Arial,sans-serif;font-size:14px;line-height:1.25;--bg:#000c17;--panel:#001827;--head:#002b44;--line:#17677c;--text:#00d9ef;--muted:#7cb8c7;--accent:#168aff;--field:#081722;--border:#00cde5;--input:#fff}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}header{background:var(--head);border-bottom:1px solid var(--border);padding:13px 16px;display:flex;align-items:center;gap:12px}header strong{font-size:20px}header small{margin-left:auto;color:var(--muted)}main{max-width:900px;margin:auto;padding:8px}section.panel{background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:12px;margin:8px 0}h2{font-size:18px;margin:0 0 12px;display:flex;align-items:center;gap:10px}.number{display:grid;place-items:center;background:var(--accent);color:white;border-radius:50%;width:34px;height:34px;flex-shrink:0}h3{font-size:14px;margin:14px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}p{color:var(--muted)}button{background:#0055e9;color:white;border:1px solid #2791ff;border-radius:5px;padding:8px 12px;cursor:pointer;font:inherit;min-height:37px}button.secondary{background:var(--head);color:var(--text);border-color:var(--border)}button.danger{background:#702b38;border-color:#b86b79}.section-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.card{border:1px solid var(--line);border-radius:6px;margin:10px 0;overflow:hidden}.card>summary{background:var(--head);font-weight:bold;cursor:pointer;padding:11px 12px;overflow-wrap:anywhere}.card-body{padding:10px}.field-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(80px,150px) 40px;gap:8px;align-items:center;min-height:42px;padding:5px 3px;border-bottom:1px solid var(--line)}.field-label{min-width:0;overflow-wrap:anywhere;line-height:1.35}.field-control{width:100%;min-width:0;max-width:100%;height:35px;border:1px solid var(--border);border-radius:4px;background:var(--field);color:var(--input);font:inherit;padding:4px 7px;text-align:right}.field-control[type=text]{text-align:left}.unit{color:var(--muted);font-size:11px;overflow-wrap:anywhere}.info{display:inline-grid;place-items:center;border:1px solid var(--border);border-radius:50%;height:23px;width:23px;font-size:12px;margin-left:5px;cursor:help;color:var(--muted)}.group{font-weight:bold;color:var(--text);margin:16px 0 6px;border-bottom:1px solid var(--border);padding-bottom:6px}.subgroup{border:1px solid var(--line);border-radius:5px;padding:7px;margin:9px 0}.subgroup>summary{cursor:pointer;font-weight:bold;padding:5px}.muted{color:var(--muted);font-size:12px}.empty{padding:15px;border:1px dashed var(--line);border-radius:6px}.note{font-size:12px;color:var(--muted)}.theme-picker{background:var(--field);color:var(--input);border:1px solid var(--border);border-radius:4px;padding:7px;max-width:135px}.hidden{display:none!important}@media(max-width:420px){header strong{font-size:16px}.field-row{grid-template-columns:minmax(0,1fr) minmax(76px,110px) 28px;gap:5px}.field-label{font-size:12px}.unit{font-size:10px}section.panel{padding:9px}h2{font-size:16px}}@media print{body{background:white;color:black}button,.section-actions,.theme-picker{display:none!important}.panel,.card{break-inside:avoid}}

.result-card{border:1px solid var(--line);border-radius:6px;padding:12px;margin:10px 0;line-height:1.8}.result-value{font-weight:bold;font-size:17px;color:var(--text);border-top:1px solid var(--line);padding-top:7px;margin-top:6px}
.extra-details{margin:12px 0;border:1px solid var(--line);border-radius:6px;overflow:hidden}.extra-details>summary{cursor:pointer;background:var(--head);padding:10px 12px;color:var(--text);font-weight:bold}.extra-body{padding:10px}.capacity-summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding:12px 0 3px;font-weight:bold}.capacity-summary strong{margin-left:auto;font-size:18px}.capacity-summary .unit{color:var(--muted);font-size:12px}
.child-card-title{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.child-card-name{font-weight:bold}.child-card-meta{display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:3px;margin-left:auto;color:var(--muted);font-size:12px;font-weight:normal}.child-card-need{font-size:13px;font-weight:bold;color:var(--text)}@media(max-width:480px){.child-card-meta{font-size:11px}.child-card-need{font-size:12px}}</style></head><body data-theme="dark"><header class="app-header"><div class="menu-holder"><button id="menuTrigger" class="menu-trigger" type="button" aria-label="Avaa valikko" aria-expanded="false" aria-controls="appMenu">☰</button><div id="appMenu" class="app-menu" hidden><div class="menu-brand"><strong>Elatusapulaskuri</strong><small>CalcForce</small></div><label for="theme">Väriteema</label><select id="theme" class="theme-picker"><option value="dark">Sininen</option><option value="light">Vaalea</option><option value="forest">Vihreä</option></select><p class="menu-note">Tässä versiossa ei ole laskentaa eikä tallennustoimintoja.</p><div class="menu-version">v0.594</div></div></div><div class="header-brand"><strong>CalcForce</strong><small>Elatusapulaskuri</small></div><span class="version">v0.594</span></header><main><section class="panel"><h2><span class="number">1</span>Vanhemmat</h2><div id="parents"></div></section><section class="panel"><h2><span class="number">2</span>Lapset</h2><div id="children"></div><div class="section-actions"><button id="add-child" type="button">+ Lisää lapsi</button></div></section><section class="panel"><h2><span class="number">3</span>Elatusavun laskelma</h2><div id="support-results" aria-live="polite"></div></section></main><script>
'use strict';
const APP_VERSION='0.594';
const FIELD_GROUPS={"income":[["earnings","Ansiotulot"],["business","Elinkeinotoiminnan tulot"],["unemployment","Työttömyyspäiväraha"],["pension","Eläkkeet"],["social","Sosiaalietuudet"],["capital","Pääomatulot"],["assets","Muu varallisuudesta saatava tulo"],["otherIncome","Muut tulot"]],"expense":[["living","Yleiset elinkustannukset"],["housing","Asumiskustannukset"],["extraHousing","Muut asumiskustannukset"],["housingAid","Asumistuki"],["otherCost","Muut elinkustannukset"],["health","Erityiset terveydenhoitomenot"],["work","Työmatkakustannukset"],["studentLoan","Opintolainamenot"],["travel","Matkakulut lapsen tapaamisesta"]],"child":[["basic","Yleiset elinkustannukset"],["housing","Lapsen osuus asumiskustannuksista"],["daycare","Päivähoitokulut"],["afterSchool","Koululaisen aamu- ja iltapäivätoiminta"],["education","Koulutuskustannukset"],["hobby","Erityisen harrastuksen kustannukset"],["insurance","Vakuutusmaksut"],["health","Erityiset terveydenhoitokustannukset"],["otherSpecial","Muut erityiset kustannukset"]],"deduction":[["benefit","Lapsilisä"],["single","Yksinhuoltajakorotus"],["study","Lapsen opintotuki / ansiotulot"],["capital","Lapsen pääomatulot"]]};
const state={parents:[],children:[]};let sequence=0;

/* Laskenta v0.594: kaikki oletusluvut ovat käyttäjän muokattavia arvioita.
   Laskuri ei ole virallinen elatusapuohjeen toteutus. */
const RULES={age:[[0,6,362],[7,12,422],[13,17,568]],benefits:[94.88,104.84,133.79,173.24,192.69],under3:26,single:73.30,care:[0,0,0,0,0],year:2026};
const num=x=>{const n=Number(String(x??'').replace(',','.'));return Number.isFinite(n)?n:0};
const money=x=>num(x).toLocaleString('fi-FI',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const val=(o,k)=>num(o?.values?.[k]);
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const ageGroups={'0-2':{cost:362,under3:true},'3-6':{cost:362,under3:false},'7-12':{cost:422,under3:false},'13-17':{cost:568,under3:false}};
const groupFromAge=age=>age<3?'0-2':age<7?'3-6':age<13?'7-12':'13-17';
const ageCost=age=>ageGroups[groupFromAge(age)].cost;
const childGroup=c=>ageGroups[c.values.ageGroup] ? c.values.ageGroup : groupFromAge(num(c.values.age));
function householdSize(residentId){if(!residentId)return 0;const p=state.parents.find(x=>x.id===residentId);if(!p)return 0;return 1+state.children.filter(x=>x.values.resident===residentId).length+Math.max(0,Math.floor(val(p,'otherResidents')))}
function calculatedChildFields(c){
 const v=c.values,group=childGroup(c),siblings=state.children.filter(x=>x.values.benefitRecipient&&x.values.benefitRecipient===v.benefitRecipient);
 const position=Math.max(0,siblings.findIndex(x=>x.id===c.id));
 const base=ageGroups[group].cost;
 const benefit=RULES.benefits[Math.min(position,RULES.benefits.length-1)];
 const resident=state.parents.find(p=>p.id===v.resident);
 const cohabitants=householdSize(v.resident);
 const housing=Math.max(0,val(resident,'expense.housing')+val(resident,'expense.extraHousing')-val(resident,'expense.housingAid'))/Math.max(1,cohabitants);
 return {'child.basic':base,'child.housing':housing,'deduction.benefit':benefit,'deduction.single':state.parents.find(p=>p.id===v.benefitRecipient)?.values.livingSituation==='single'?RULES.single:0,'deduction.under3':ageGroups[group].under3?RULES.under3:0};
}
function amount(c,key){const mode=key==='deduction.under3'?'auto':c.values['mode.'+key]??'auto';return mode==='manual'?val(c,key):num(calculatedChildFields(c)[key])}
function childNeed(c){
 const extras=['child.daycare','child.afterSchool','child.education','child.hobby','child.insurance','child.health','child.otherSpecial'].reduce((a,k)=>a+val(c,k),0);
 const gross=amount(c,'child.basic')+amount(c,'child.housing')+extras;
 const deductions=['deduction.benefit','deduction.single','deduction.under3'].reduce((a,k)=>a+amount(c,k),0)+val(c,'deduction.study')+val(c,'deduction.capital');
 return {gross,deductions,need:Math.max(0,gross-deductions)};
}
function parentIncomeBreakdown(p){
 const gross=FIELD_GROUPS.income.reduce((sum,[k])=>sum+val(p,'income.'+k),0);
 const taxRate=clamp(val(p,'taxPercent'),0,100);
 const tax=gross*taxRate/100;
 const automaticNet=Math.max(0,gross-tax);
 const mode=p.values.netMode??'auto';
 return {gross,tax,taxRate,automaticNet,mode,net:mode==='manual'?val(p,'netIncome'):automaticNet};
}
function parentCapacity(p){
 const income=parentIncomeBreakdown(p).net;
 const living=p.values['expense.living']===''?0:val(p,'expense.living');
 const expenses=living+Math.max(0,val(p,'expense.housing')+val(p,'expense.extraHousing')-val(p,'expense.housingAid'))+
 ['otherCost','health','work','studentLoan','travel'].reduce((a,k)=>a+val(p,'expense.'+k),0);
 return {income,expenses,capacity:Math.max(0,income-expenses)};
}
function calculateAll(){
 const capacities=new Map(state.parents.map(p=>[p.id,parentCapacity(p)]));
 // Sovitut muiden lasten osuudet ovat suuntaa antavia elatusvastuita.
 // Niitä ei vähennetä automaattisesti: yleiskulut ja asuminen voivat sisältää samoja menoja.
 const agreedObligations=state.children.filter(c=>c.values.otherChildObligation==='yes').reduce((sum,c)=>sum+childNeed(c).need*clamp(c.values.supportPercent===''||c.values.supportPercent===undefined?50:val(c,'supportPercent'),0,100)/100,0);
 const rows=state.children.map(c=>{
  const v=c.values,a=state.parents.find(p=>p.id===v.parentA),b=state.parents.find(p=>p.id===v.parentB),resident=state.parents.find(p=>p.id===v.resident);
  const n=childNeed(c),ca=capacities.get(a?.id)?.capacity??0,cb=capacities.get(b?.id)?.capacity??0;
  const method=v.method??'capacity';
  const share=ca+cb>0?ca/(ca+cb):0;
  const payer=resident?.id===a?.id?b:resident?.id===b?.id?a:null;
  const payerShare=ca+cb<=0?0:payer?.id===a?.id?share:1-share;
  const nights=clamp(val(c,'nights'),0,30);
  // Suuntaa antava luonapitovähennys, ei virallisen taulukon euromäärä.
  const care=nights>=7?Math.min(n.need*payerShare,n.need*clamp(nights/30,0,0.5)*0.3):0;
  const shared=nights>=13;
  const base=payer&&ca+cb>0?n.need*payerShare:0;
  const final=method==='agreement'?Math.max(0,val(c,'agreedSupport')):method==='percentage'?Math.max(0,n.need*clamp(v.supportPercent===''||v.supportPercent===undefined?50:val(c,'supportPercent'),0,100)/100):payer&&!shared?Math.max(0,base-care):0;
  return {c,n,a,b,resident,payer,share,care,shared,base,final,method,capacityA:ca,capacityB:cb};
 });
 return {capacities,rows,agreedObligations};
}
function refreshResults(){
 const model=calculateAll(),node=document.getElementById('support-results');
 if(!node)return;
 node.innerHTML='<p class="note">Suuntaa antava laskelma. Tarkista tulot, lapsilisän saaja, asumisjärjestelyt ja luonapitovähennys. Laskenta ei ole viranomaisen vahvistama.</p>'+
 model.rows.map(r=>'<div class="result-card"><strong>'+escapeHtml(r.c.name)+'</strong><div>Elatuksen tarve: '+money(r.n.need)+'/kk</div>'+(r.method==='capacity'?'<div>Elatusvastuu: '+escapeHtml(r.a?.name||'Vanhempi 1')+' '+(r.share*100).toFixed(1)+' % / '+escapeHtml(r.b?.name||'Vanhempi 2')+' '+((1-r.share)*100).toFixed(1)+' %</div><div>Luonapitovähennys (arvio): '+money(r.care)+'/kk</div><div>'+(r.payer?'Maksaja: '+escapeHtml(r.payer.name)+' → '+escapeHtml(r.resident?.name||'vastaanottaja'):'Maksajaa ei määritetty')+'</div>':r.method==='percentage'?'<div>Maksajan osuus: '+clamp(r.c.values.supportPercent===''||r.c.values.supportPercent===undefined?50:val(r.c,'supportPercent'),0,100).toLocaleString('fi-FI')+' %</div>':'<div>Vanhempien sopima summa</div>')+'<div class="result-value">'+(r.method==='capacity'&&r.shared?'Vuoroasuminen: erillinen kustannusjako tarvitaan':r.method==='agreement'?'Sovittu elatusapu: '+money(r.final)+'/kk':r.method==='percentage'?'Prosenttiosuuden mukainen elatusapu: '+money(r.final)+'/kk':'Arvioitu elatusapu: '+money(r.final)+'/kk')+'</div></div>').join('')+
 '<h3>Vanhempien arvioitu elatuskyky</h3>'+state.parents.map(p=>'<div>'+escapeHtml(p.name)+': '+money(model.capacities.get(p.id)?.capacity)+'/kk</div>').join('')+'<p class="note">Muiden lasten sovitut kustannusosuudet näytetään erikseen eikä niitä vähennetä automaattisesti elatuskyvystä, jotta samoja asumis- ja elinkustannuksia ei lasketa kahdesti.</p>';
 document.querySelectorAll('#parents .card').forEach(card=>{
 const p=state.parents.find(x=>x.id===card.dataset.id);if(!p)return;
 const b=parentIncomeBreakdown(p);
 const input=card.querySelector('[data-key="netIncome"]');
 if(input){input.readOnly=b.mode==='auto';if(b.mode==='auto'&&document.activeElement!==input)input.value=b.automaticNet.toFixed(2);}
 for(const [key,value] of [['gross',b.gross],['tax',b.tax],['net',b.net]]){
  const el=card.querySelector('[data-'+key+']');if(el)el.textContent=money(value).replace(' €','');
 }
});
 document.querySelectorAll('#parents [data-parent-situation]').forEach(el=>{const p=state.parents.find(x=>x.id===el.dataset.parentSituation);el.textContent=p?(p.values.livingSituation==='partner'?'Parisuhteessa asuva':'Yksin asuva'):''});
 document.querySelectorAll('#parents [data-parent-meta]').forEach(el=>{const p=state.parents.find(x=>x.id===el.dataset.parentMeta);el.textContent=p?money(parentCapacity(p).capacity).replace(' €',''):'0,00'});
 document.querySelectorAll('#parents [data-capacity]').forEach(el=>{const p=state.parents.find(x=>x.id===el.dataset.capacity);el.textContent=p?money(parentCapacity(p).capacity).replace(' €',''):'0,00'});
 document.querySelectorAll('#children .card').forEach(card=>{const r=model.rows.find(x=>x.c.id===card.dataset.id),p=card.querySelector('[data-child-summary]');if(r&&p)p.textContent=money(r.method==='agreement'?r.final:r.n.need).replace(' €','');if(r){const household=card.querySelector('[data-household]');if(household)household.textContent=householdSize(r.c.values.resident);const housingInput=card.querySelector('[data-key="child.housing"]');if(housingInput&&r.c.values['mode.child.housing']!=='manual')housingInput.value=calculatedChildFields(r.c)['child.housing'];const meta=card.querySelector('[data-child-meta]'),need=card.querySelector('[data-child-need]'),v=r.c.values,group=childGroup(r.c).replace('-', '–');if(meta)meta.textContent=group+' v · '+(r.method==='agreement'?'Sopimus '+money(r.final):r.method==='percentage'?clamp(v.supportPercent===''||v.supportPercent===undefined?50:val(r.c,'supportPercent'),0,100).toLocaleString('fi-FI')+' %':'Elatuskyky');if(need)need.textContent='Elatuksen tarve '+money(r.n.need)+'/kk'}});
}

const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function make(kind){return {id:kind+'-'+(++sequence),name:kind==='parent'?'Vanhempi '+(state.parents.length+1):'Lapsi '+(state.children.length+1),values:{}}}
function field(key,label,value='',unit='€/kk',options=null,help=''){const id='f-'+(++sequence);const control=options?'<select class="field-control" data-key="'+escapeHtml(key)+'">'+options.map(([v,t])=>'<option value="'+escapeHtml(v)+'" '+(String(value)===String(v)?'selected':'')+'>'+escapeHtml(t)+'</option>').join('')+'</select>':'<input class="field-control" data-key="'+escapeHtml(key)+'" type="'+(unit==='text'?'text':'number')+'" '+(unit==='text'?'maxlength="100"':'min="0" step="any" inputmode="decimal"')+' value="'+escapeHtml(value)+'">';return '<label class="field-row" for="'+id+'"><span class="field-label">'+escapeHtml(label)+(help?'<span class="info" title="'+escapeHtml(help)+'" aria-label="Lisätieto">i</span>':'')+'</span>'+control.replace('class="field-control"','id="'+id+'" class="field-control"')+'<span class="unit">'+(unit==='text'?'':escapeHtml(unit))+'</span></label>'}
function fields(group,item){return FIELD_GROUPS[group].map(([k,label])=>{const key=group+'.'+k;const auto=group==='child'||group==='deduction' ? ['child.basic','child.housing','deduction.benefit','deduction.single','deduction.under3'].includes(key):false;const value=auto&&item.values['mode.'+key]!=='manual'?calculatedChildFields(item)[key]:item.values[key]??'';return field(key,label,value,'€/kk',null,auto?'Automaattinen arvio. Valitse käsin syöttö muuttaaksesi arvoa.':'')+(auto?field('mode.'+key,'Laskentatapa: '+label,item.values['mode.'+key]??'auto','',[['auto','Automaattinen'],['manual','Käsin']]):'')}).join('')}
function heading(t){return '<div class="group">'+escapeHtml(t)+'</div>'}
function parentCard(p){
 const detailedIncome=FIELD_GROUPS.income.map(([k,label])=>field('income.'+k,label,p.values['income.'+k]??'')).join('');
 const detailedExpenses=FIELD_GROUPS.expense.filter(([k])=>!['housing','living','housingAid'].includes(k)).map(([k,label])=>field('expense.'+k,label,p.values['expense.'+k]??'')).join('');
 return '<details class="card" data-id="'+p.id+'"><summary class="child-card-title parent-card-title"><span class="child-card-name parent-card-name">'+escapeHtml(p.name)+'</span><span class="child-card-meta parent-card-meta"><span data-parent-situation="'+escapeHtml(p.id)+'"></span><span class="child-card-need">Elatuskyky <strong data-parent-meta="'+escapeHtml(p.id)+'"></strong> €/kk</span></span></summary><div class="card-body">'+
 '<details class="extra-details" open><summary>Perustiedot</summary><div class="extra-body">'+
 field('name','Vanhemman nimi',p.name,'text')+
 field('livingSituation','Perhetilanne',p.values.livingSituation??'single','',[['single','Yksin asuva'],['partner','Parisuhteessa asuva']])+
 field('netIncome','Nettotulot',parentIncomeBreakdown(p).mode==='auto'?parentIncomeBreakdown(p).automaticNet.toFixed(2):p.values.netIncome??'','€/kk',null,'Automaattitilassa summa lasketaan Tulot-osion bruttotuloista ja veroprosentista. Käsin syötettäessä valitse käsin-laskenta.')+
 field('expense.living','Yleiset elinkustannukset',p.values['expense.living']??'')+
 field('expense.housing','Asumiskustannukset',p.values['expense.housing']??'')+
 field('expense.housingAid','Asumistuki',p.values['expense.housingAid']??'')+field('otherResidents','Muut samassa taloudessa asuvat henkilöt',p.values.otherResidents??'0','hlö',null,'Esimerkiksi puoliso tai muu asukas, jota ei ole merkitty lapsikorttiin.')+
 '</div></details>'+
 '<details class="extra-details"><summary>Tulot</summary><div class="extra-body">'+
 field('netMode','Nettotulojen laskentatapa',parentIncomeBreakdown(p).mode,'',[['auto','Automaattinen bruttotuloista'],['manual','Syötän nettotulot itse']])+field('taxPercent','Arvioitu veroprosentti',p.values.taxPercent??'0','%')+detailedIncome+'<div class="capacity-summary">Bruttotulot yhteensä <strong data-gross="'+escapeHtml(p.id)+'"></strong><span class="unit">€/kk</span></div><div class="capacity-summary">Arvioitu vero <strong data-tax="'+escapeHtml(p.id)+'"></strong><span class="unit">€/kk</span></div><div class="capacity-summary">Arvioidut nettotulot <strong data-net="'+escapeHtml(p.id)+'"></strong><span class="unit">€/kk</span></div><p class="note">Veroprosentti on yksinkertaistettu arvio. Eri tulolajien verotus ja muut pidätykset voivat poiketa siitä.</p>'+
 '</div></details>'+
 '<details class="extra-details"><summary>Menot</summary><div class="extra-body">'+detailedExpenses+'</div></details>'+
 '<div class="capacity-summary">Arvioitu elatuskyky <strong data-capacity="'+escapeHtml(p.id)+'"></strong><span class="unit">€/kk</span></div>'+
 '<div class="section-actions"><button class="danger" data-remove="parent" type="button">Poista vanhempi</button></div></div></details>'
}
function basicChildField(c,key,label){
 const automatic=c.values['mode.'+key]!=='manual';
 const value=automatic?calculatedChildFields(c)[key]:c.values[key]??'';
 const editable=key!=='deduction.under3';
 return field(key,label,value,'€/kk',null,editable?'Arvo lasketaan automaattisesti, kunnes muutat sitä itse.':'Automaattinen ikäryhmän perusteella.')+
 (editable?'<button type="button" class="auto-reset" data-auto-reset="'+escapeHtml(key)+'" '+(automatic?'hidden':'')+'>Palauta automaattinen arvo</button>':'');
}
function childCard(c){const parents=[['','Valitse vanhempi'],...state.parents.map(p=>[p.id,p.name])],method=c.values.method??'capacity';const details='<details class="extra-details"><summary>Lapsen tulot ja menot</summary><div class="extra-body">'+heading('Menot')+FIELD_GROUPS.child.filter(([k])=>k!=='basic').map(([k,label])=>{const key='child.'+k;return key==='child.housing'?'':field(key,label,c.values[key]??'')}).join('')+heading('Tulot')+FIELD_GROUPS.deduction.filter(([k])=>['study','capital'].includes(k)).map(([k,label])=>field('deduction.'+k,label,c.values['deduction.'+k]??'')).join('')+'</div></details>';return '<details class="card" data-id="'+c.id+'"><summary class="child-card-title"><span class="child-card-name">'+escapeHtml(c.name)+'</span><span class="child-card-meta"><span data-child-meta></span><span class="child-card-need" data-child-need></span></span></summary><div class="card-body">'+heading('Perustiedot')+field('name','Lapsen nimi',c.name,'text')+field('ageGroup','Ikäryhmä',childGroup(c),'',[['0-2','0–2 vuotta'],['3-6','3–6 vuotta'],['7-12','7–12 vuotta'],['13-17','13–17 vuotta']])+basicChildField(c,'child.basic','Yleiset elinkustannukset')+basicChildField(c,'child.housing','Lapsen osuus asumiskustannuksista')+'<div class="capacity-summary">Talouden henkilömäärä <strong data-household="'+escapeHtml(c.id)+'">0</strong><span class="unit">hlö</span></div>'+basicChildField(c,'deduction.benefit','Lapsilisä')+basicChildField(c,'deduction.single','Yksinhuoltajakorotus')+basicChildField(c,'deduction.under3','Alle 3-vuotiaan korotus')+field('method','Laskentatapa',method,'',[['capacity','Elatuskyvyn suhteessa'],['percentage','Prosenttiosuudella'],['agreement','Vanhempien sopimus']])+(method==='percentage'?field('supportPercent','Sovittu kustannusosuus',c.values.supportPercent??'50','%'):method==='agreement'?field('agreedSupport','Sovittu elatusapu',c.values.agreedSupport??'0','€/kk'):'')+heading('Vanhemmat')+field('parentA','Vanhempi 1',c.values.parentA??'','',parents)+field('parentB','Vanhempi 2',c.values.parentB??'','',parents)+field('benefitRecipient','Kenelle lapsilisä maksetaan?',c.values.benefitRecipient??'','',parents)+heading('Asuminen')+field('resident','Asuinvanhempi',c.values.resident??'','',parents)+field('nights','Yöpymiset tapaavalla vanhemmalla',c.values.nights??'','yötä/kk')+details+'<div class="capacity-summary">'+(method==='agreement'?'Sovittu elatusapu':method==='percentage'?'Lapsen elatuksen tarve':'Lapsen elatuksen tarve')+' <strong data-child-summary="'+escapeHtml(c.id)+'">0,00</strong><span class="unit">€/kk</span></div><div class="section-actions"><button class="danger" data-remove="child" type="button">Poista lapsi</button></div></div></details>'}
function render(kind){const node=document.getElementById(kind==='parent'?'parents':'children');const items=kind==='parent'?state.parents:state.children;const opened=new Set([...node.querySelectorAll('.card[open]')].map(x=>x.dataset.id));const expanded=new Set([...node.querySelectorAll('.extra-details[open]')].map(x=>x.closest('.card').dataset.id+'|'+x.querySelector('summary')?.textContent));node.innerHTML=items.map(item=>kind==='parent'?parentCard(item):childCard(item)).join('');node.querySelectorAll('.card').forEach(card=>{card.open=opened.has(card.dataset.id);card.querySelectorAll('.extra-details').forEach(extra=>{const key=card.dataset.id+'|'+extra.querySelector('summary')?.textContent;if(expanded.has(key))extra.open=true;else if(opened.has(card.dataset.id))extra.open=false})})}
function add(kind){const list=kind==='parent'?state.parents:state.children;list.push(make(kind));render(kind);if(kind==='parent')render('child');refreshResults()}
function update(e,kind){const control=e.target.closest('[data-key]');if(!control)return;const card=control.closest('[data-id]');if(!card)return;const list=kind==='parent'?state.parents:state.children;const item=list.find(x=>x.id===card.dataset.id);if(!item)return;const key=control.dataset.key;if(key==='name'){item.name=control.value;if(kind==='child'){const nameNode=card.querySelector('.child-card-name');if(nameNode)nameNode.textContent=item.name;}else{const nameNode=card.querySelector('.parent-card-name');if(nameNode)nameNode.textContent=item.name;}if(kind==='parent'&&e.type==='change')render('child')}else item.values[key]=control.value;if(kind==='parent'&&key==='netIncome'&&e.type==='input'&&item.values.netMode!=='manual'){item.values.netMode='manual';const mode=card.querySelector('[data-key="netMode"]');if(mode)mode.value='manual';}if(kind==='child'&&e.type==='input'&&['child.basic','child.housing','deduction.benefit','deduction.single'].includes(key)){item.values['mode.'+key]='manual';const reset=card.querySelector('[data-auto-reset="'+key+'"]');if(reset)reset.hidden=false;}if(e.type==='change'){if(kind==='parent'){if(key==='netMode'){const netInput=card.querySelector('[data-key="netIncome"]');if(netInput){netInput.readOnly=item.values.netMode==='auto';if(item.values.netMode==='manual'&&(!item.values.netIncome&&item.values.netIncome!==0))item.values.netIncome=parentIncomeBreakdown(item).automaticNet.toFixed(2);netInput.value=item.values.netMode==='auto'?parentIncomeBreakdown(item).automaticNet.toFixed(2):item.values.netIncome??'';}}if(key==='livingSituation'){const el=card.querySelector('[data-parent-situation]');if(el)el.textContent=item.values.livingSituation==='partner'?'Parisuhteessa asuva':'Yksin asuva';}render('child');}else if(key==='ageGroup'||key==='method'||key==='benefitRecipient'||key==='resident'||key.startsWith('mode.'))render('child');}refreshResults()}
document.getElementById('parents').addEventListener('input',e=>update(e,'parent'));document.getElementById('parents').addEventListener('change',e=>update(e,'parent'));document.getElementById('children').addEventListener('input',e=>update(e,'child'));document.getElementById('children').addEventListener('change',e=>update(e,'child'));
document.querySelectorAll('#parents,#children').forEach(node=>node.addEventListener('click',e=>{const reset=e.target.closest('[data-auto-reset]');if(reset){const card=reset.closest('[data-id]'),child=state.children.find(x=>x.id===card?.dataset.id);if(child){const key=reset.dataset.autoReset;delete child.values['mode.'+key];delete child.values[key];const input=card.querySelector('[data-key="'+key+'"]');if(input)input.value=calculatedChildFields(child)[key];reset.hidden=true;refreshResults();}return;}const button=e.target.closest('[data-remove]');if(!button)return;const kind=button.dataset.remove,id=button.closest('[data-id]').dataset.id,list=kind==='parent'?state.parents:state.children;list.splice(list.findIndex(x=>x.id===id),1);render(kind);if(kind==='parent')render('child');refreshResults()}));
document.getElementById('add-child').addEventListener('click',()=>add('child'));document.getElementById('theme').addEventListener('change',e=>document.body.dataset.theme=e.target.value);
const menuTrigger=document.getElementById('menuTrigger'),appMenu=document.getElementById('appMenu');
function setMenuOpen(open){appMenu.hidden=!open;menuTrigger.setAttribute('aria-expanded',String(open))}
menuTrigger.addEventListener('click',()=>setMenuOpen(appMenu.hidden));
document.addEventListener('click',e=>{if(!e.target.closest('.menu-holder'))setMenuOpen(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')setMenuOpen(false)});
